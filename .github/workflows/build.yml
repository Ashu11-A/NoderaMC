# Build & test on push/PR. JDK: host provides JDK 25 in this environment; CI uses Temurin 21
# once the Task 0 pin is restored.
#
# Two toolchains, one gate (Task 27, legacy spec docs/old/Task.27.md): the `java` job and the `rust` job are both
# required. A red cargo job blocks merge exactly like a red `./gradlew check` — the Rust services
# speak the same frozen wire contract, so a codec regression is a consensus regression.
name: build
on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check build --stacktrace
      # `check build` is cacheable end to end, so a healthy run can finish in ~40s with every
      # `:*:test` FROM-CACHE — visually identical to a job that skipped into green. Judge the gate
      # by what it reported, not by how long it took: this asserts that every module with test
      # sources produced JUnit results (Gradle restores those reports on a cache hit, so the numbers
      # are real either way) and puts the executed count in the job summary.
      - name: Java tests reported results
        if: always()
        run: scripts/java-test-report.sh --summary
      # The golden wire fixtures are committed; `:transport:test` fails if the encoder drifts from
      # them. Fail loudly if the run mutated a fixture (that can only happen with the deliberate
      # -Dnodera.fixtures.regenerate flag, which must never be set in CI).
      - name: Golden fixtures unchanged
        run: git diff --exit-code -- fixtures/

  # L-47's exit job: build the companion app, prove the gate both ways, and prove a hosted
  # world survives the host closing Minecraft (the worker keeps it alive).
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/nodera-app
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Build service binaries + worker dist
        run: |
          (cd rust && cargo build --release --bin nodera-tracker --bin nodera-rendezvous)
          ./gradlew :worker:installDist
          mkdir -p build
          cp -r java/worker/build/install/nodera-headless build/
      - uses: oven-sh/setup-bun@v2
      - name: Build the companion UI (tauri frontendDist)
        run: cd rust/nodera-app/ui && bun install --frozen-lockfile && bun run build
      - name: Build the companion app
        run: cd rust/nodera-app && cargo build --release
      # The app's own tests have never run in CI, which is how the settings model, the
      # NODERA-CONFIG golden string and the worker's spawn environment were all covered by tests
      # that only ever ran on somebody's laptop. `nodera-app` is outside the cargo workspace, so
      # the `rust` job's `cargo test` does not reach it.
      - name: Test the companion app
        run: cd rust/nodera-app && cargo test
      - name: Gate both ways (worker present => start, absent => actionable abort)
        run: ./gradlew :neoforge-mod:test --tests 'dev.nodera.mod.common.CompanionGateTest'
      - name: Hosted world survives the host closing Minecraft
        run: ./gradlew :worker:test --tests 'dev.nodera.headless.WorldContinuityIT' --tests 'dev.nodera.headless.CompanionCrashSurvivalIT'

  # M-5's exit job. Java 21 type-pattern switches (`case SomeType v ->`) compile to an
  # `invokedynamic` on `java.lang.runtime.SwitchBootstraps`; ART does not implement it and D8 cannot
  # desugar it, so one reaching the worker's closure is a crash on the phone and nowhere else. It is
  # latent — the worker boots, announces, serves state, and dies encoding its first peer message,
  # taking the app's process with it. Nothing in `./gradlew check` can see that, because the
  # property that matters is "no invoke-custom in the dex" and only the dexer can say.
  #
  # So the guard runs here, on every push, against the real compiled distribution.
  android-bytecode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # build-tools 35 specifically: 34's R8 8.2 cannot even read Java 21 class files
      # ("Unsupported class file major version 65"), so an older d8 would fail for the wrong reason.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
      - name: No bytecode Android cannot run
        run: scripts/check-android-bytecode.sh

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel; rustup honours it automatically.
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Includes the cross-language conformance tests: the tag-registry mirror is asserted against
      # the Java sources, and every `fixtures/wire/*.bin` is decoded + re-encoded byte-exactly.
      - run: cargo test

  # `services/official.json` is data maintained by pull request from outside the project, so the
  # gate has to be something a contributor can run before opening one — and the failure has to name
  # the offending line rather than being "the app did not start". Pure stdlib Python: a validation
  # job that needs its own dependency install is a job that breaks for reasons unrelated to the file
  # it validates.
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the official service index
        run: scripts/services.py --validate
      # Proves the file is usable, not merely well-formed: a list that parses and yields no
      # endpoints would pass a schema check and leave every peer with nothing to contact.
      - name: The index yields endpoints of both kinds
        run: |
          set -euo pipefail
          scripts/services.py --endpoints tracker
          scripts/services.py --endpoints rendezvous

  release-artifacts:
    # Service binaries are published per tag: operators run `nodera-tracker` / `nodera-rendezvous`
    # as standalone infrastructure, so they need built artifacts, not a source checkout.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [java, rust]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --bin nodera-tracker --bin nodera-rendezvous
      - uses: actions/upload-artifact@v4
        with:
          name: nodera-services-${{ github.ref_name }}
          path: |
            rust/target/release/nodera-tracker
            rust/target/release/nodera-rendezvous
          if-no-files-found: error
