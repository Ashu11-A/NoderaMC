# Build & test on push/PR. JDK: host provides JDK 25 in this environment; CI uses Temurin 21
# once the Task 0 pin is restored.
#
# Two toolchains, one gate (Task 27, legacy spec docs/old/Task.27.md): the `java` job and the `rust` job are both
# required. A red cargo job blocks merge exactly like a red `./gradlew check` — the Rust services
# speak the same frozen wire contract, so a codec regression is a consensus regression.
name: build
on:
  push:
  pull_request:

# Least privilege by default. `badges` needs `contents: write` to push its orphan branch and says
# so itself; nothing else here writes anything. Without a default, every job inherits whatever the
# repository's default token scope happens to be — not a decision this file was making deliberately.
permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # No `dtolnay/rust-toolchain@stable`: rust-toolchain.toml pins the channel and rustup honours
      # it, the same reasoning the `companion` job carries.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # ---------------------------------------------------------------------------------------
      # What `./gradlew check` needs in order to be the gate it claims to be.
      #
      # Twelve tests in this job were SKIPPED on every run this workflow has ever done, and always
      # for the same reason: "a cargo binary or the peer distribution was not built". Seven
      # `TrackerServiceIT`, one `RendezvousRelayIT`, one `WorldContinuityIT`, one
      # `CompanionCrashSurvivalIT` and two `TelemetryRegistryMirrorTest` — the suites that drive the
      # REAL service binaries rather than a Java stand-in, which is precisely what makes them worth
      # having. `cargo build --release` lived in a different job, so `2,423 passed / 12 skipped`
      # overstated what this gate proved, and an `assumeTrue` on a path that has moved reports as a
      # skip rather than as a failure (see docs/testing/TESTING.md).
      #
      # The rule that file already states is the fix: anything the build produces is BUILT by the
      # runner rather than waited for. `--release` is not a choice — `TestPaths.trackerBinary()`
      # resolves `<dir.cargoTarget>/release/nodera-tracker` and nothing else.
      #
      # A separate Gradle invocation, before `check`, on purpose: `:peer:test` does not depend on
      # `:peer:installDist`, so naming both in one command leaves the order to Gradle and the
      # distribution can land after the test that needed it.
      # ---------------------------------------------------------------------------------------
      - name: Build what the real-binary suites drive
        run: |
          set -euo pipefail
          cargo build --release --bin nodera-tracker --bin nodera-rendezvous --bin nodera-telemetry
          ./gradlew :peer:installDist
      # `-Dnodera.test.requireServiceBinaries=true` is the promise the step above just kept, made
      # legible to the suites. `SpawnedService` turns a missing service binary from an `assumeTrue`
      # skip into a failure only when it is set, and `NoderaServiceBinaries.kt` forwards it from the
      # launcher into every `Test` worker (a bare `-D` reaches the Gradle daemon and nothing else).
      # Nothing set it, so the mechanism ran by hand only.
      #
      # This adds no coverage: `Nothing skipped into green` below already refuses ANY skip, which is
      # the stronger property. What it adds is a specific failure — the suite that could not find
      # `target/release/nodera-tracker` says so at the point it looked, instead of the job ending on
      # a count of skips that somebody then has to attribute.
      - run: ./gradlew check build --stacktrace -Dnodera.test.requireServiceBinaries=true
      # `check build` is cacheable end to end, so a healthy run can finish in ~40s with every
      # `:*:test` FROM-CACHE — visually identical to a job that skipped into green. Judge the gate
      # by what it reported, not by how long it took: this asserts that every module with test
      # sources produced JUnit results (Gradle restores those reports on a cache hit, so the numbers
      # are real either way) and puts the executed count in the job summary.
      - name: Java tests reported results
        if: always()
        run: scripts/java-test-report.sh --summary
      # And the nine numbers README prints beside those modules. `test-counts.sh` resolved only
      # `crate.*` and `package.*`, so ten rows of that table were measured and the nine Java ones were
      # typed — same table, same column, rendered identically, checked by nothing. Three had drifted
      # (`engine` 444 against 446, `testing` 44 against 46, `neoforge-mod` 133 against 134).
      #
      # `--check java` measures exactly the Gradle modules, from the JUnit XML the step above just
      # read, so it costs no cargo enumeration and cannot run before there are results. Naming them
      # is what makes a missing result a failure here rather than the `skipped` the two jobs without
      # Java results are entitled to. Re-stamp a deliberate change with `test-counts.sh --write java`.
      - name: README's Java module counts match the suites
        if: always()
        run: scripts/test-counts.sh --check java
      # The number README's badge shows. Measured from the JUnit XML this job just produced, not
      # from a second, cheaper run — see scripts/test-totals.sh for why that distinction is the
      # whole point of the badge.
      - name: Java test totals
        if: always()
        run: |
          set -euo pipefail
          mkdir -p run/totals
          scripts/test-totals.sh --java > run/totals/java.json
          cat run/totals/java.json
      # The other half of the step above: `passed` is the badge, and `skipped` is the number the
      # badge cannot show. This job reported `2,423 passed / 12 skipped` on every run, and all twelve
      # were the real-binary suites waiting for something the job simply had not built — a suite that
      # skips is a suite that asserts nothing, and it renders exactly like one that passed.
      #
      # Zero is stamped, not derived. A new skip is a decision: either the runner builds what it
      # needs (the step above is where that goes), or the test is `@Disabled` with a reason, or this
      # number moves in the same commit and somebody reviews the line that moved it.
      - name: Nothing skipped into green
        if: always()
        run: |
          set -euo pipefail
          python3 - run/totals/java.json <<'PY'
          import json, sys
          skipped = json.load(open(sys.argv[1]))["skipped"]
          if skipped:
              sys.exit(
                  f"{skipped} Java test(s) skipped. A skip asserts nothing and renders as a pass. "
                  "Build what they wait for in 'Build what the real-binary suites drive', disable "
                  "them with a reason, or re-stamp the expected count in this step."
              )
          print("no Java test skipped")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: totals-java
          path: run/totals/java.json
          if-no-files-found: error
          retention-days: 1
      # The golden wire fixtures are committed; `:transport:test` fails if the encoder drifts from
      # them. Fail loudly if the run mutated a fixture (that can only happen with the deliberate
      # -Dnodera.fixtures.regenerate flag, which must never be set in CI).
      - name: Golden fixtures unchanged
        run: git diff --exit-code -- fixtures/
      # README documents `scripts/version.sh --check` as part of the gate, and nothing in CI ran it:
      # the root VERSION file is mirrored into Cargo, Tauri, and a Java constant, and a mirror left
      # behind ships artifacts labelled with a version they are not. Pure bash, so it costs nothing
      # to make the documented claim true.
      - name: Every version mirror agrees with VERSION
        run: scripts/version.sh --check
      # The size ratchet of the Plan 11 reduction programme (docs/plans/Plan.11.md). `--selftest`
      # runs first because the ratchet is only worth as much as the lexer under it: a regression
      # that made the classifier count comments as code would otherwise show up as a tree that
      # shrank. Growth is not forbidden — it has to be re-stamped with `--baseline` in the same
      # commit, which turns "the tree got bigger" into a line somebody reviews.
      - name: Source size is within its stamped baseline
        run: |
          scripts/loc-metrics.py --selftest
          scripts/loc-metrics.py --check
      # The Rust and TypeScript half of a question Java has been answering since phase 1:
      # `:peer:structureReport` ratchets `never_referenced_methods` in `fixtures/structure/budget.json`
      # and 45 methods were deleted on the strength of it — while `pub fn` and `export` went
      # unasked, across 43% of the tree's code. Not a hypothetical gap: `onDrainNotice` had no caller
      # anywhere, so the service-drain migration lane ran on no node, and `circuit_idle_timeout_seconds`
      # was loaded, validated, env-overridable and read by nothing. Same shape, two more languages.
      - name: Every exported symbol has a call site
        run: scripts/reference-check.py --check
      # `layout.properties` is the one layout table, and `LayoutManifestTest` holds Gradle, the Java
      # harness, the scripts and the Rust tests to it. Workflow YAML, Dockerfiles, `.dockerignore`
      # and `tauri.*.conf.json` cannot read it — GitHub, Docker and Tauri parse them first — and
      # those are exactly the files that fail SILENTLY: a `paths:` filter that matches nothing does
      # not error, it stops firing, and the job goes on reporting green about a directory that
      # moved. This is the grep that notices.
      - name: Layout references resolve (workflows, Dockerfiles, tauri config)
        run: scripts/check-layout-drift.sh
      # The same shape of defect as the line above — something that is fine here and broken
      # somewhere nobody looks. Linux is case-sensitive; macOS and Windows are not, so
      # `app/ui/src/network.ts` beside `app/ui/src/Network.tsx` was two modules on every runner this
      # workflow had ever used and ONE module on the release runners, where `tsc` resolved
      # `./Network` to the lowercase file and failed. It had been latent for the life of the UI and
      # is invisible from a case-sensitive machine: every local build and every review passes.
      - name: No paths that collide by case on macOS or Windows
        run: scripts/check-case-collisions.sh
      # `docs/` is ~1,000 files that cross-reference each other by relative path, and nothing
      # checked those links. The 2026-07-30 worker -> peer rename moved ninety-six of them at once;
      # the only symptom of getting that wrong is a 404 for whoever clicks. Table shape is checked
      # alongside it because a limitation row with a missing cell still RENDERS — as values under
      # the wrong headings, which is worse than a row that fails.
      - name: Docs links resolve and tables are square
        run: scripts/check-docs.sh

  # L-47's exit job: build the companion app, prove the gate both ways, and prove a hosted
  # world survives the host closing Minecraft (the worker keeps it alive).
  companion:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, and it is not a convenience. The website mirrors nine documents out of this
      # tree and dates each one from `git log -1` over its source; under the default shallow clone
      # there is no history to date them from, so every "last updated" on the site would quietly
      # become the date CI happened to run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The two orphan branches the site reads, neither of which a checkout has. `services` carries
      # the published service list — one of the nine mirrored documents lives on it — and `badges`
      # carries the measured test totals `/status` shows. Both fail closed rather than rendering a
      # page with a hole in it, so fetching them here is what keeps the site step honest instead of
      # merely green.
      - name: Fetch the orphan branches the site reads
        run: git fetch --depth=1 origin services:services badges:badges
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # No `dtolnay/rust-toolchain@stable` here: rust-toolchain.toml pins the channel and
      # rustup honours it automatically (see the `rust` job). Installing `stable` on top
      # compiled nothing and put a FLOATING version into the rust-cache key, so every
      # stable release invalidated the whole cache — one guaranteed cold build per cycle.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      # Every file the app's per-OS Tauri configs declare as a `bundle.resources` entry has to exist
      # before `cargo build` runs, because `tauri-build` resolves them in the build script: a plain
      # path that is missing is a hard `ResourcePathNotFound`, not a warning. That is deliberate —
      # the mod jar was declared by no config for the whole life of the project, so the install
      # screen answered "this build carries no mod jar" forever, and the point of the plain path is
      # that the omission can never be silent again. It also means this step and
      # `app/tauri.linux.conf.json` have to be edited together.
      - name: Build service binaries + worker dist + mod jar
        run: |
          set -euo pipefail
          # `layout.properties` through its own reader, rather than three more hardcoded module
          # paths in a YAML file no `LayoutManifestTest` can see. A relocation must not be able to
          # break CI silently.
          source scripts/lib/layout.sh
          layout_export
          (cargo build --release --bin nodera-tracker --bin nodera-rendezvous)
          ./gradlew :peer:installDist :neoforge-mod:jar
          mkdir -p "$NODERA_ARTIFACTS"
          cp -r "$NODERA_PEER_MODULE/build/install/nodera-headless" "$NODERA_ARTIFACTS/"
          # The same collected name `scripts/release.sh` stages and `api::modinstall` looks for.
          install -m 0644 "$NODERA_MOD_DIR/build/libs/nodera-neoforge.jar" \
                          "$NODERA_ARTIFACTS/nodera-neoforge.jar"
      - uses: oven-sh/setup-bun@v2
      - name: Build the companion UI (tauri frontendDist)
        run: scripts/build-app-ui.sh
      # The website, built here rather than in a job of its own: it is the third package in the same
      # bun workspace as the companion UI, so it shares the install this job has already paid for.
      # `build-site.sh` runs the site's whole test suite as its last step, which is where the release
      # bijection, the mirror's fail-closed rules, the `/add-store` acceptance suite and the
      # no-Tauri-in-the-browser-bundle check all run.
      - name: Build the website
        run: scripts/build-site.sh
      # 209 frontend tests, counted by nothing until now. Both build scripts above run their
      # package's `node --test` through `tee`, hold the result to README's stamped count, and leave
      # the totals here; this uploads them so the badge stops understating the tree by two whole
      # suites. See `scripts/test-totals.sh --tap` for why an empty glob was the failure that made
      # counting them worth doing.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: totals-frontend
          path: |
            run/totals/app-ui.json
            run/totals/site.json
          if-no-files-found: error
          retention-days: 1
      - name: Build the companion app
        run: cd app && cargo build --release
      # The app's own tests have never run in CI, which is how the settings model, the
      # NODERA-CONFIG golden string and the worker's spawn environment were all covered by tests
      # that only ever ran on somebody's laptop. `nodera-app` is outside the cargo workspace, so
      # the `rust` job's `cargo test` does not reach it.
      - name: Test the companion app
        run: |
          set -o pipefail
          mkdir -p run
          (cd app && cargo test 2>&1) | tee run/cargo-app.log
      # `nodera-app` is a separate cargo workspace, so the `rust` job's total does not include it.
      # Leaving it out would understate the tree by the largest Rust suite in it.
      - name: Companion app test totals
        if: always()
        run: |
          mkdir -p run/totals
          scripts/test-totals.sh --cargo run/cargo-app.log --source app > run/totals/app.json
          cat run/totals/app.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: totals-app
          path: run/totals/app.json
          if-no-files-found: error
          retention-days: 1
      # The lint half of the same omission (the fmt half runs in the `rust` job, which needs no
      # compilation). `app` is its own cargo workspace, so `cargo clippy` in the `rust`
      # job never reached a line of it — the whole companion app was exempt from the `-D warnings`
      # standard the rest of the Rust tree is held to. It lives here rather than in `rust` because
      # linting Tauri needs the webkit2gtk system deps this job already installs.
      - name: Lint the companion app
        run: |
          rustup component add clippy
          cd app && cargo clippy --all-targets -- -D warnings
      # The worker dist and ui/dist are both built above, so this is the run that also covers the
      # companion app's count.
      - name: README's test counts match the suites (all six crates)
        run: scripts/test-counts.sh --check
      - name: Gate both ways (worker present => start, absent => actionable abort)
        # `:peer`, not `:neoforge-mod`: CompanionGate is Minecraft-free and lives with the control wire
        # it gates. A --tests filter that matches nothing FAILS the build,
        # which is what caught this — a filter is only a gate while it points at a real class.
        run: ./gradlew :peer:test --tests 'dev.nodera.peer.control.CompanionGateTest'
      - name: Hosted world survives the host closing Minecraft
        run: ./gradlew :peer:test --tests 'dev.nodera.headless.WorldContinuityIT' --tests 'dev.nodera.headless.CompanionCrashSurvivalIT'

  # M-5's exit job. Java 21 type-pattern switches (`case SomeType v ->`) compile to an
  # `invokedynamic` on `java.lang.runtime.SwitchBootstraps`; ART does not implement it and D8 cannot
  # desugar it, so one reaching the worker's closure is a crash on the phone and nowhere else. It is
  # latent — the worker boots, announces, serves state, and dies encoding its first peer message,
  # taking the app's process with it. Nothing in `./gradlew check` can see that, because the
  # property that matters is "no invoke-custom in the dex" and only the dexer can say.
  #
  # So the guard runs here, on every push, against the real compiled distribution.
  android-bytecode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # build-tools 35 specifically: 34's R8 8.2 cannot even read Java 21 class files
      # ("Unsupported class file major version 65"), so an older d8 would fail for the wrong reason.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
      - name: No bytecode Android cannot run
        run: scripts/check-android-bytecode.sh

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel; rustup honours it automatically.
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo fmt --check
      # `app` is EXCLUDED from this workspace (Tauri native deps), so the line above
      # skipped it silently: the companion app had never been format-checked, and `src/api/store.rs`
      # sat drifted on main. rustfmt parses source and needs no dependencies, so the second
      # workspace is checked here — a formatting failure should not wait on a Tauri build. The
      # matching clippy run is in the `companion` job, which has the system deps to compile it.
      - run: cargo fmt --check --manifest-path app/Cargo.toml
      - run: cargo clippy --all-targets -- -D warnings
      # Includes the cross-language conformance tests: the tag-registry mirror is asserted against
      # the Java sources, and every `fixtures/wire/*.bin` is decoded + re-encoded byte-exactly.
      # `tee` because the totals are parsed from libtest's own `test result:` summaries. Piping
      # through tee keeps the log on the job page AND gives the badge something real to count;
      # `pipefail` keeps a red suite red through the pipe.
      - name: cargo test
        run: |
          set -o pipefail
          mkdir -p run
          cargo test 2>&1 | tee run/cargo-workspace.log
      - name: Rust test totals
        if: always()
        run: |
          mkdir -p run/totals
          scripts/test-totals.sh --cargo run/cargo-workspace.log --source rust > run/totals/rust.json
          cat run/totals/rust.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: totals-rust
          path: run/totals/rust.json
          if-no-files-found: error
          retention-days: 1
      # README's per-crate test-count column was hand-typed and had drifted by up to 47 tests
      # (tracker claimed 62 against 109). A count in a README is read as evidence, so it is measured
      # from `cargo test -- --list` rather than remembered. `nodera-app` needs the worker dist and
      # the built UI to enumerate, so the script skips it here; the `companion` job, which builds
      # both, checks all six.
      - name: README's test counts match the suites
        working-directory: ${{ github.workspace }}
        run: scripts/test-counts.sh --check

  # The service index is data maintained by pull request from outside the project, and it lives on
  # the orphan `services` branch rather than in this tree. The pull requests that *change* it are
  # gated by `.github/workflows/index.yml` on that branch; this job gates the other direction — that
  # `main` can still resolve it, and that what it resolves is still usable.
  #
  # That distinction matters. A change on `main` — a renamed layout key, a moved cache directory, a
  # resolver that stopped falling back — breaks every build that compiles the list in, and it breaks
  # them somewhere unhelpful: an app whose built-in store is empty reports "no trackers are
  # answering", which reads as a broken network rather than a broken build. Pure stdlib Python: a
  # validation job that needs its own dependency install is a job that breaks for reasons unrelated
  # to what it validates.
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Shallow and explicit. `actions/checkout` fetches only the pushed ref, so the resolver would
      # otherwise fall through to the raw URL and this job would pass on a network round trip rather
      # than on the ref every other build reads.
      - name: Fetch the services branch
        run: git fetch --depth 1 origin services:services
      - name: Main resolves the official service index from the branch
        run: scripts/services.py --validate
      # Proves the file is usable, not merely well-formed: a list that parses and yields no
      # endpoints would pass a schema check and leave every peer with nothing to contact.
      - name: The index yields endpoints of both kinds
        run: |
          set -euo pipefail
          scripts/services.py --endpoints tracker
          scripts/services.py --endpoints rendezvous
      # The fallbacks are the whole design, and an untested fallback is one that is broken the day
      # it is needed. Two of them are exercised here, in the order a build would meet them.
      #
      # First: no ref at all, which is what a shallow clone and every `actions/checkout` look like.
      # The resolver must fetch the branch itself rather than falling through to a web server.
      - name: With no local ref, the resolver fetches the branch
        run: |
          set -euo pipefail
          git branch -D services
          git update-ref -d refs/remotes/origin/services || true
          rm -rf build/services
          scripts/services.py --validate
      # Second: no ref and no way to get one, which is a build behind a firewall that permits https
      # and not git. The published URL is the last thing between that build and a failure.
      - name: With no ref and no remote, the resolver falls back to the published URL
        run: |
          set -euo pipefail
          git branch -D services || true
          git update-ref -d refs/remotes/origin/services || true
          git remote set-url origin https://example.invalid/nothing.git
          rm -rf build/services
          scripts/services.py --validate

  # The release naming table has two implementations — `scripts/lib/release.sh` and
  # `update.rs::service_asset_name` — and `release_names_match_the_shell_table` (in the `rust` job)
  # compares them. What neither can see is whether the deliverable list still MATCHES the build:
  # renaming a Gradle archive or dropping a bundle target is a green build and a release that is
  # quietly one asset short, discovered by whoever downloads it.
  #
  # So the manifest is asserted here, on every push, against the shape the release lane produces.
  # It is pure bash and costs seconds; the alternative is finding out at tag time.
  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The release manifest is the documented set of deliverables
        run: |
          set -euo pipefail
          expected='nodera-neoforge-latest.jar
          nodera-paper-latest.jar
          nodera-peer-latest.jar
          nodera-app-linux-x64.deb
          nodera-app-linux-arm64.deb
          nodera-app-windows-x64.msi
          nodera-app-windows-arm64.msi
          nodera-app-android-universal.apk
          nodera-tracker-x64-latest
          nodera-tracker-arm64-latest
          nodera-rendezvous-x64-latest
          nodera-rendezvous-arm64-latest'
          diff <(printf '%s\n' "$expected" | sed 's/^ *//') \
               <(NODERA_RELEASE_TAG=latest scripts/release.sh --names)
      # A `v*` tag must not silently produce `latest`-named assets, which is what a version token
      # read from the wrong place would do.
      - name: A tagged release names its assets after the tag
        run: |
          set -euo pipefail
          # Captured into a variable rather than piped into `grep -q`: `-q` exits on the first
          # match, the producing script takes SIGPIPE, and `pipefail` reports the whole step as
          # failed for a reason that has nothing to do with the assertion.
          names="$(NODERA_RELEASE_TAG=v9.9.9 scripts/release.sh --names)"
          grep -qx 'nodera-peer-9.9.9.jar'      <<<"$names"
          grep -qx 'nodera-tracker-arm64-9.9.9' <<<"$names"
          # And the tag must not leak the `latest` token into a versioned release.
          ! grep -q 'latest' <<<"$names"

  # --- the README badge ------------------------------------------------------------------------
  #
  # README used to carry a "Build · passing" badge, which is a statement about a workflow's exit
  # code. This repository has repeatedly hit the one thing such a badge cannot see — a job that
  # skips into green — so the badge now shows a NUMBER that only a suite which actually ran can
  # produce: how many tests passed, and how many failed.
  #
  # The three test jobs each measured their own share and uploaded it — five totals across them,
  # since the `companion` job carries the app's separate cargo workspace and both frontend
  # packages; this job only sums and renders. Nothing is re-run to produce a badge, because a number
  # from a second, cheaper run would be a badge about a run nobody looked at.
  #
  # `always()` on purpose: a red run is exactly when the failed count must update.
  #
  # ## A missing half is a failure, not a skip
  #
  # `Every half reported` used to answer a missing totals file with `::warning::` and an output that
  # switched the remaining two steps off, so the job concluded SUCCESS while the badge kept last
  # week's number — the same "green about nothing" shape the badge itself was built to replace, one
  # level up. There were three ways into it when it was written and there are five now, and the two
  # newest (`app-ui`, `site`) come out of the `companion` job at the end of the longest dependency
  # chain in this workflow: `bun install`, the Tauri system deps, `:peer:installDist`,
  # `:neoforge-mod:jar`. Any of those breaking on `main` is exactly the case where nobody would look.
  #
  # So it fails. The badge is stale either way; the only thing that changes is whether anyone knows.
  # A second red X on a run whose upstream job already failed is the cost, and it is the right cost —
  # it says "the published totals no longer describe this tree", which is true.
  #
  # There is no tolerant branch for other events because this job never sees one: the `if:` below
  # restricts it to a push on `main`, the only event that publishes anything.
  #
  # ## Why an orphan branch
  #
  # shields.io needs to fetch a JSON over HTTP. `main` is branch-protected, so CI cannot write
  # there; a gist would need a personal token as a secret. A single-commit orphan branch needs
  # neither, is force-pushed so it never accumulates history, and contains nothing but the two badge
  # documents — there is no code on it to review, run, or confuse a checkout.
  badges:
    needs: [java, rust, companion]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: run/totals
          pattern: totals-*
          merge-multiple: true
      # Every part is named, not just the first missing one: a run where the whole `companion` job
      # failed is missing three, and reporting one of them sends the reader to the wrong job.
      - name: Every half reported
        run: |
          set -euo pipefail
          missing=()
          for part in java rust app app-ui site; do
            [[ -s "run/totals/$part.json" ]] || missing+=("$part")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::no totals for: ${missing[*]} — the published badge still shows the previous run's number and no longer describes this tree. Fix the job that produces the missing part; do not downgrade this to a warning."
            exit 1
          fi
          echo "all five totals present"
      - name: Sum and render
        run: |
          scripts/test-totals.sh --merge run/totals/java.json run/totals/rust.json \
            run/totals/app.json run/totals/app-ui.json run/totals/site.json \
            --badges run/badges
          cat run/badges/tests-passed.json run/badges/tests-failed.json
      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp run/badges/tests-passed.json run/badges/tests-failed.json "$RUNNER_TEMP/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A fresh orphan every time, force-pushed: the branch is a two-file publishing surface,
          # not a history worth keeping, and an append-only machine-written branch grows without
          # bound for no reader.
          git switch --orphan badges
          # `switch --orphan` clears the index and every TRACKED file, and leaves untracked ones —
          # including `run/`, whose .gitignore entry has just been removed along with the file that
          # contained it. Without this clean, `git add -A` publishes the downloaded artifacts and
          # the cargo logs onto the badges branch.
          git clean -ffdxq
          cp "$RUNNER_TEMP/tests-passed.json" "$RUNNER_TEMP/tests-failed.json" .
          cat > README.md <<'EOF'
          # badges

          Generated. Do not edit, do not branch from this.

          Two [shields.io endpoint](https://shields.io/badges/endpoint-badge) documents holding the
          test totals README displays, written by the `badges` job in `.github/workflows/build.yml`
          from the results the `java`, `rust` and `companion` jobs measured. This branch is an orphan
          and is force-pushed on every run to `main`; it carries no source.
          EOF
          git add -A
          git commit -q -m "test totals from ${GITHUB_SHA:0:7}"
          git push -f origin badges
