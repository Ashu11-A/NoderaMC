# Build & test on push/PR. JDK: host provides JDK 25 in this environment; CI uses Temurin 21
# once the Task 0 pin is restored.
#
# Two toolchains, one gate (Task 27, legacy spec docs/old/Task.27.md): the `java` job and the `rust` job are both
# required. A red cargo job blocks merge exactly like a red `./gradlew check` — the Rust services
# speak the same frozen wire contract, so a codec regression is a consensus regression.
name: build
on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check build --stacktrace
      # `check build` is cacheable end to end, so a healthy run can finish in ~40s with every
      # `:*:test` FROM-CACHE — visually identical to a job that skipped into green. Judge the gate
      # by what it reported, not by how long it took: this asserts that every module with test
      # sources produced JUnit results (Gradle restores those reports on a cache hit, so the numbers
      # are real either way) and puts the executed count in the job summary.
      - name: Java tests reported results
        if: always()
        run: scripts/java-test-report.sh --summary
      # The number README's badge shows. Measured from the JUnit XML this job just produced, not
      # from a second, cheaper run — see scripts/test-totals.sh for why that distinction is the
      # whole point of the badge.
      - name: Java test totals
        if: always()
        run: |
          mkdir -p run/totals
          scripts/test-totals.sh --java > run/totals/java.json
          cat run/totals/java.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: totals-java
          path: run/totals/java.json
          if-no-files-found: error
          retention-days: 1
      # The golden wire fixtures are committed; `:transport:test` fails if the encoder drifts from
      # them. Fail loudly if the run mutated a fixture (that can only happen with the deliberate
      # -Dnodera.fixtures.regenerate flag, which must never be set in CI).
      - name: Golden fixtures unchanged
        run: git diff --exit-code -- fixtures/
      # README documents `scripts/version.sh --check` as part of the gate, and nothing in CI ran it:
      # the root VERSION file is mirrored into Cargo, Tauri, and a Java constant, and a mirror left
      # behind ships artifacts labelled with a version they are not. Pure bash, so it costs nothing
      # to make the documented claim true.
      - name: Every version mirror agrees with VERSION
        run: scripts/version.sh --check
      # `layout.properties` is the one layout table, and `LayoutManifestTest` holds Gradle, the Java
      # harness, the scripts and the Rust tests to it. Workflow YAML, Dockerfiles, `.dockerignore`
      # and `tauri.*.conf.json` cannot read it — GitHub, Docker and Tauri parse them first — and
      # those are exactly the files that fail SILENTLY: a `paths:` filter that matches nothing does
      # not error, it stops firing, and the job goes on reporting green about a directory that
      # moved. This is the grep that notices.
      - name: Layout references resolve (workflows, Dockerfiles, tauri config)
        run: scripts/check-layout-drift.sh
      # The same shape of defect as the line above — something that is fine here and broken
      # somewhere nobody looks. Linux is case-sensitive; macOS and Windows are not, so
      # `app/ui/src/network.ts` beside `app/ui/src/Network.tsx` was two modules on every runner this
      # workflow had ever used and ONE module on the release runners, where `tsc` resolved
      # `./Network` to the lowercase file and failed. It had been latent for the life of the UI and
      # is invisible from a case-sensitive machine: every local build and every review passes.
      - name: No paths that collide by case on macOS or Windows
        run: scripts/check-case-collisions.sh
      # `docs/` is ~1,000 files that cross-reference each other by relative path, and nothing
      # checked those links. The 2026-07-30 worker -> peer rename moved ninety-six of them at once;
      # the only symptom of getting that wrong is a 404 for whoever clicks. Table shape is checked
      # alongside it because a limitation row with a missing cell still RENDERS — as values under
      # the wrong headings, which is worse than a row that fails.
      - name: Docs links resolve and tables are square
        run: scripts/check-docs.sh

  # L-47's exit job: build the companion app, prove the gate both ways, and prove a hosted
  # world survives the host closing Minecraft (the worker keeps it alive).
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Build service binaries + worker dist
        run: |
          (cargo build --release --bin nodera-tracker --bin nodera-rendezvous)
          ./gradlew :peer:installDist
          mkdir -p build
          cp -r peer/build/install/nodera-headless build/
      - uses: oven-sh/setup-bun@v2
      - name: Build the companion UI (tauri frontendDist)
        run: cd app/ui && bun install --frozen-lockfile && bun run build
      - name: Build the companion app
        run: cd app && cargo build --release
      # The app's own tests have never run in CI, which is how the settings model, the
      # NODERA-CONFIG golden string and the worker's spawn environment were all covered by tests
      # that only ever ran on somebody's laptop. `nodera-app` is outside the cargo workspace, so
      # the `rust` job's `cargo test` does not reach it.
      - name: Test the companion app
        run: |
          set -o pipefail
          mkdir -p run
          (cd app && cargo test 2>&1) | tee run/cargo-app.log
      # `nodera-app` is a separate cargo workspace, so the `rust` job's total does not include it.
      # Leaving it out would understate the tree by the largest Rust suite in it.
      - name: Companion app test totals
        if: always()
        run: |
          mkdir -p run/totals
          scripts/test-totals.sh --cargo run/cargo-app.log --source app > run/totals/app.json
          cat run/totals/app.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: totals-app
          path: run/totals/app.json
          if-no-files-found: error
          retention-days: 1
      # The lint half of the same omission (the fmt half runs in the `rust` job, which needs no
      # compilation). `app` is its own cargo workspace, so `cargo clippy` in the `rust`
      # job never reached a line of it — the whole companion app was exempt from the `-D warnings`
      # standard the rest of the Rust tree is held to. It lives here rather than in `rust` because
      # linting Tauri needs the webkit2gtk system deps this job already installs.
      - name: Lint the companion app
        run: |
          rustup component add clippy
          cd app && cargo clippy --all-targets -- -D warnings
      # The worker dist and ui/dist are both built above, so this is the run that also covers the
      # companion app's count.
      - name: README's test counts match the suites (all six crates)
        run: scripts/test-counts.sh --check
      - name: Gate both ways (worker present => start, absent => actionable abort)
        # `:peer`, not `:neoforge-mod`: CompanionGate is Minecraft-free and lives with the control wire
        # it gates. A --tests filter that matches nothing FAILS the build,
        # which is what caught this — a filter is only a gate while it points at a real class.
        run: ./gradlew :peer:test --tests 'dev.nodera.peer.control.CompanionGateTest'
      - name: Hosted world survives the host closing Minecraft
        run: ./gradlew :peer:test --tests 'dev.nodera.headless.WorldContinuityIT' --tests 'dev.nodera.headless.CompanionCrashSurvivalIT'

  # M-5's exit job. Java 21 type-pattern switches (`case SomeType v ->`) compile to an
  # `invokedynamic` on `java.lang.runtime.SwitchBootstraps`; ART does not implement it and D8 cannot
  # desugar it, so one reaching the worker's closure is a crash on the phone and nowhere else. It is
  # latent — the worker boots, announces, serves state, and dies encoding its first peer message,
  # taking the app's process with it. Nothing in `./gradlew check` can see that, because the
  # property that matters is "no invoke-custom in the dex" and only the dexer can say.
  #
  # So the guard runs here, on every push, against the real compiled distribution.
  android-bytecode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # build-tools 35 specifically: 34's R8 8.2 cannot even read Java 21 class files
      # ("Unsupported class file major version 65"), so an older d8 would fail for the wrong reason.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
      - name: No bytecode Android cannot run
        run: scripts/check-android-bytecode.sh

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel; rustup honours it automatically.
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo fmt --check
      # `app` is EXCLUDED from this workspace (Tauri native deps), so the line above
      # skipped it silently: the companion app had never been format-checked, and `src/api/store.rs`
      # sat drifted on main. rustfmt parses source and needs no dependencies, so the second
      # workspace is checked here — a formatting failure should not wait on a Tauri build. The
      # matching clippy run is in the `companion` job, which has the system deps to compile it.
      - run: cargo fmt --check --manifest-path app/Cargo.toml
      - run: cargo clippy --all-targets -- -D warnings
      # Includes the cross-language conformance tests: the tag-registry mirror is asserted against
      # the Java sources, and every `fixtures/wire/*.bin` is decoded + re-encoded byte-exactly.
      # `tee` because the totals are parsed from libtest's own `test result:` summaries. Piping
      # through tee keeps the log on the job page AND gives the badge something real to count;
      # `pipefail` keeps a red suite red through the pipe.
      - name: cargo test
        run: |
          set -o pipefail
          mkdir -p run
          cargo test 2>&1 | tee run/cargo-workspace.log
      - name: Rust test totals
        if: always()
        run: |
          mkdir -p run/totals
          scripts/test-totals.sh --cargo run/cargo-workspace.log --source rust > run/totals/rust.json
          cat run/totals/rust.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: totals-rust
          path: run/totals/rust.json
          if-no-files-found: error
          retention-days: 1
      # README's per-crate test-count column was hand-typed and had drifted by up to 47 tests
      # (tracker claimed 62 against 109). A count in a README is read as evidence, so it is measured
      # from `cargo test -- --list` rather than remembered. `nodera-app` needs the worker dist and
      # the built UI to enumerate, so the script skips it here; the `companion` job, which builds
      # both, checks all six.
      - name: README's test counts match the suites
        working-directory: ${{ github.workspace }}
        run: scripts/test-counts.sh --check

  # `services/official.json` is data maintained by pull request from outside the project, so the
  # gate has to be something a contributor can run before opening one — and the failure has to name
  # the offending line rather than being "the app did not start". Pure stdlib Python: a validation
  # job that needs its own dependency install is a job that breaks for reasons unrelated to the file
  # it validates.
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the official service index
        run: scripts/services.py --validate
      # Proves the file is usable, not merely well-formed: a list that parses and yields no
      # endpoints would pass a schema check and leave every peer with nothing to contact.
      - name: The index yields endpoints of both kinds
        run: |
          set -euo pipefail
          scripts/services.py --endpoints tracker
          scripts/services.py --endpoints rendezvous

  # The release naming table has two implementations — `scripts/lib/release.sh` and
  # `update.rs::service_asset_name` — and `release_names_match_the_shell_table` (in the `rust` job)
  # compares them. What neither can see is whether the deliverable list still MATCHES the build:
  # renaming a Gradle archive or dropping a bundle target is a green build and a release that is
  # quietly one asset short, discovered by whoever downloads it.
  #
  # So the manifest is asserted here, on every push, against the shape the release lane produces.
  # It is pure bash and costs seconds; the alternative is finding out at tag time.
  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The release manifest is the documented set of deliverables
        run: |
          set -euo pipefail
          expected='nodera-neoforge-latest.jar
          nodera-paper-latest.jar
          nodera-peer-latest.jar
          nodera-app-linux-x64.deb
          nodera-app-linux-arm64.deb
          nodera-app-macos-x64.dmg
          nodera-app-macos-arm64.dmg
          nodera-app-windows-x64.msi
          nodera-app-windows-arm64.msi
          nodera-tracker-x64-latest
          nodera-tracker-arm64-latest
          nodera-rendezvous-x64-latest
          nodera-rendezvous-arm64-latest'
          diff <(printf '%s\n' "$expected" | sed 's/^ *//') \
               <(NODERA_RELEASE_TAG=latest scripts/release.sh --names)
      # A `v*` tag must not silently produce `latest`-named assets, which is what a version token
      # read from the wrong place would do.
      - name: A tagged release names its assets after the tag
        run: |
          set -euo pipefail
          # Captured into a variable rather than piped into `grep -q`: `-q` exits on the first
          # match, the producing script takes SIGPIPE, and `pipefail` reports the whole step as
          # failed for a reason that has nothing to do with the assertion.
          names="$(NODERA_RELEASE_TAG=v9.9.9 scripts/release.sh --names)"
          grep -qx 'nodera-peer-9.9.9.jar'      <<<"$names"
          grep -qx 'nodera-tracker-arm64-9.9.9' <<<"$names"
          # And the tag must not leak the `latest` token into a versioned release.
          ! grep -q 'latest' <<<"$names"

  # --- the README badge ------------------------------------------------------------------------
  #
  # README used to carry a "Build · passing" badge, which is a statement about a workflow's exit
  # code. This repository has repeatedly hit the one thing such a badge cannot see — a job that
  # skips into green — so the badge now shows a NUMBER that only a suite which actually ran can
  # produce: how many tests passed, and how many failed.
  #
  # The three test jobs each measured their own half and uploaded it; this job only sums and
  # renders. Nothing is re-run to produce a badge, because a number from a second, cheaper run
  # would be a badge about a run nobody looked at.
  #
  # `always()` on purpose: a red run is exactly when the failed count must update. The publish is
  # skipped when a totals file is missing, since a partial sum would silently understate the tree.
  #
  # ## Why an orphan branch
  #
  # shields.io needs to fetch a JSON over HTTP. `main` is branch-protected, so CI cannot write
  # there; a gist would need a personal token as a secret. A single-commit orphan branch needs
  # neither, is force-pushed so it never accumulates history, and contains nothing but the two badge
  # documents — there is no code on it to review, run, or confuse a checkout.
  badges:
    needs: [java, rust, companion]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: run/totals
          pattern: totals-*
          merge-multiple: true
      - name: Every half reported
        id: parts
        run: |
          set -euo pipefail
          missing=0
          for part in java rust app; do
            if [[ ! -s "run/totals/$part.json" ]]; then
              echo "::warning::no totals for $part — the badge would understate the tree, so it is not updated"
              missing=1
            fi
          done
          echo "complete=$((1 - missing))" >> "$GITHUB_OUTPUT"
      - name: Sum and render
        if: steps.parts.outputs.complete == '1'
        run: |
          scripts/test-totals.sh --merge run/totals/java.json run/totals/rust.json run/totals/app.json \
            --badges run/badges
          cat run/badges/tests-passed.json run/badges/tests-failed.json
      - name: Publish to the badges branch
        if: steps.parts.outputs.complete == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp run/badges/tests-passed.json run/badges/tests-failed.json "$RUNNER_TEMP/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A fresh orphan every time, force-pushed: the branch is a two-file publishing surface,
          # not a history worth keeping, and an append-only machine-written branch grows without
          # bound for no reader.
          git switch --orphan badges
          # `switch --orphan` clears the index and every TRACKED file, and leaves untracked ones —
          # including `run/`, whose .gitignore entry has just been removed along with the file that
          # contained it. Without this clean, `git add -A` publishes the downloaded artifacts and
          # the cargo logs onto the badges branch.
          git clean -ffdxq
          cp "$RUNNER_TEMP/tests-passed.json" "$RUNNER_TEMP/tests-failed.json" .
          cat > README.md <<'EOF'
          # badges

          Generated. Do not edit, do not branch from this.

          Two [shields.io endpoint](https://shields.io/badges/endpoint-badge) documents holding the
          test totals README displays, written by the `badges` job in `.github/workflows/build.yml`
          from the results the `java`, `rust` and `companion` jobs measured. This branch is an orphan
          and is force-pushed on every run to `main`; it carries no source.
          EOF
          git add -A
          git commit -q -m "test totals from ${GITHUB_SHA:0:7}"
          git push -f origin badges
