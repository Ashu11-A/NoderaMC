# Publishes the container images to GHCR, for linux/amd64 and linux/arm64.
#
# <!-- AI-AGENT-INSTRUCTION: The two-job shape (build per platform by digest, then merge into one
#      manifest list) is not incidental. Do not collapse it into a single `platforms: amd64,arm64`
#      build: that path emulates arm64 through QEMU, and a Rust release build under emulation takes
#      the better part of an hour per image. Native runners take minutes. If a service is added,
#      add it to BOTH matrices — AND add the paths it builds from to BOTH `paths:` filters, or it
#      is published from a workflow that never fires for its own source. -->
#
# Tags, one package with a tag per service and channel:
#
#   ghcr.io/ashu11-a/noderamc:tracker-canary        every push to main
#   ghcr.io/ashu11-a/noderamc:tracker-latest        every v* tag
#   ghcr.io/ashu11-a/noderamc:tracker-0.1.0         every v* tag, the version from /VERSION
#   ghcr.io/ashu11-a/noderamc:tracker-sha-abc1234   every push — this is what you pin
#
# A feature branch publishes the `sha-` tag and nothing else. That is deliberate: it lets a
# deployment lane be tested against a real, CI-built, multi-architecture image before the branch
# merges, while no tag anybody else follows moves. `canary` and `latest` only ever come from main
# and from a release tag.
#
# A pull request builds amd64 only and pushes nothing: the point there is to catch a broken
# Dockerfile, and six images per PR to prove it is not worth the minutes.

name: containers

on:
  push:
    # `feat/**` as well as `feature/**`: the branches this repo actually uses are named `feat/…`
    # (matching the commit-type vocabulary), so the `feature/**` glob has never matched one. The
    # consequence is silent and expensive — a branch can rewrite the tracker and the relay, as
    # `feat/launcher-redesign` did across fifty Rust files, and no image is ever built for it. The
    # deployment then has nothing to deploy, and the first symptom is a live tracker accepting
    # connections and closing them without answering, which reads like a firewall and is not one.
    branches: [main, 'feature/**', 'feat/**']
    tags: ['v*']
    # The two filters below are duplicated on purpose — GitHub has no anchor syntax for a `paths:`
    # list — and they must be edited together. The `web/**` and `scripts/build-site.sh` entries are
    # the second half of the same defect the branch globs above describe: until they were added the
    # site image was published by a workflow that did not fire when the site changed, so editing a
    # page rebuilt nothing and the deployment kept serving the previous one indefinitely.
    #
    # `docker/**` already covers `docker/web/**`; it is not listed twice.
    #
    # `app/ui/**` used to be deliberately ABSENT, with a note saying that if the site ever imported
    # from the shared UI tree, the COPY and this list had to gain it in the same commit. The site now
    # does — `web/src/styles.css` imports the launcher's stylesheet and `build-tokens.mjs` parses it
    # — so it is here, along with the rest of what the site is generated from.
    #
    # This list is broad on purpose, and broader than it looks like it should be. The site is
    # GENERATED FROM THE REPOSITORY: the roadmap table, the ten limitation registers, the launcher's
    # palette, the published service list and nine mirrored documents all come out of files here
    # rather than being retyped into pages. So `docs/**` and the root markdown really are site
    # sources, and a filter that omitted them would be the same defect the branch globs above
    # describe — a workflow that does not fire when the thing it publishes changed, whose only
    # symptom is a deployment serving last week's page indefinitely.
    #
    # The cost is that a documentation commit rebuilds four images rather than one. That is the
    # cheap direction to be wrong in: a redundant build wastes minutes, a missing one publishes a
    # stale site and says nothing.
    paths:
      - 'library/**'
      - 'tracker/**'
      - 'rendezvous/**'
      - 'telemetry/**'
      - 'web/**'
      - 'app/ui/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docker/**'
      - 'layout.properties'
      - 'VERSION'
      - '*.md'
      - '.dockerignore'
      - '.github/workflows/containers.yml'
  pull_request:
    paths:
      - 'library/**'
      - 'tracker/**'
      - 'rendezvous/**'
      - 'telemetry/**'
      - 'web/**'
      - 'app/ui/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docker/**'
      - 'layout.properties'
      - 'VERSION'
      - '*.md'
      - '.dockerignore'
      - '.github/workflows/containers.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ashu11-a/noderamc

# Least privilege by default. A job that needs more says so itself and overrides this block.
# Without a default, every job inherits whatever the repository's default token scope happens to
# be — which is not a decision this file was making deliberately.
permissions:
  contents: read

jobs:
  # The platform list is computed rather than written into the matrix because a matrix `exclude`
  # cannot depend on the event, and a pull request only needs one architecture to prove the
  # Dockerfile still builds.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.pick.outputs.platforms }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          both='[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]'
          one='[{"arch":"amd64","runner":"ubuntu-24.04"}]'
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            echo "platforms=$one" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=$both" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.service }} · ${{ matrix.platform.arch }}
    needs: plan
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # `web` is the site, not a service: no Rust in it, and its builder runs
        # scripts/build-site.sh. It rides this workflow anyway because the tag scheme, the
        # per-architecture digest build and the manifest verification below are the parts that are
        # hard to get right, and none of them care what is inside the image.
        service: [tracker, rendezvous, telemetry, web]
        # Native runners for both architectures — free for public repositories, and the reason this
        # workflow finishes in minutes rather than emulating arm64 for the better part of an hour.
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    steps:
      # The web image builds a REPOSITORY, not a directory of files, and the three service images do
      # not. `docker/web/Dockerfile` runs `scripts/build-site.sh`, which mirrors nine documents:
      # eight are files on disk, the ninth lives on the orphan `services` branch and is read with
      # `git show`, and every mirrored page is dated from `git log -1` over its source. Under the
      # default shallow clone there is no history to date them from and no orphan ref to read, so the
      # site build fails closed — which is better than the alternative it replaced, but it fails.
      #
      # This is the recipe `build.yml`'s companion job already proved; it is repeated here rather
      # than shared because these are two workflows.
      #
      # The quotes around '0' and '1' are not decorative. GitHub expressions treat the NUMBER 0 as
      # falsy, so `matrix.service == 'web' && 0 || 1` evaluates to 1 for every service including web
      # — the classic form of this trap. Non-empty strings are truthy, so these are strings.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.service == 'web' && '0' || '1' }}

      - name: Fetch the orphan branches the site reads
        if: matrix.service == 'web'
        # `services` carries the published service list — one of the nine mirrored documents lives on
        # it — and `badges` carries the measured test totals /status shows. Both fail closed rather
        # than rendering a page with a hole in it.
        run: git fetch --depth=1 origin services:services badges:badges

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, with no tag: the tags are applied once, in the merge job, to a manifest
      # list covering every architecture. Tagging here would leave the tag pointing at whichever
      # architecture finished last.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Record the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ matrix.service }}-${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.service }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.service }} · manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Same list as the build matrix above. They are two matrices because they are two jobs, not
        # because they may differ: a service in one and not the other either builds images nothing
        # tags, or tags nothing was built.
        service: [tracker, rendezvous, telemetry, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # /VERSION is the single source of truth for the product version — never hard-code one, and
      # never read it from the git tag, which can disagree with the file.
      - name: Work out the tags
        id: tags
        run: |
          set -euo pipefail
          service='${{ matrix.service }}'
          short="$(git rev-parse --short HEAD)"
          tags="-t ${IMAGE}:${service}-sha-${short}"
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            version="$(tr -d '[:space:]' < VERSION)"
            tags="$tags -t ${IMAGE}:${service}-latest -t ${IMAGE}:${service}-${version}"
          elif [[ '${{ github.ref_name }}' == 'main' ]]; then
            tags="$tags -t ${IMAGE}:${service}-canary"
          fi
          # Anything else — a feature branch — gets the sha tag only. A moving tag that a
          # deployment follows must never point at an unmerged branch.
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "primary=${IMAGE}:${service}-sha-${short}" >> "$GITHUB_OUTPUT"

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          refs=()
          for file in "${{ matrix.service }}"-*; do
            refs+=("${IMAGE}@sha256:${file#${{ matrix.service }}-}")
          done
          docker buildx imagetools create ${{ steps.tags.outputs.tags }} "${refs[@]}"

      # Proves the thing this workflow exists for. A manifest list that silently covers one
      # architecture pulls fine on the machine that built it and fails on everyone else's.
      - name: Verify both architectures are in the manifest
        run: |
          set -euo pipefail
          inspected="$(docker buildx imagetools inspect '${{ steps.tags.outputs.primary }}' --raw)"
          echo "$inspected"
          for arch in amd64 arm64; do
            echo "$inspected" | grep -q "\"architecture\": \"$arch\"" \
              || { echo "::error::$arch missing from the manifest for ${{ matrix.service }}"; exit 1; }
          done
