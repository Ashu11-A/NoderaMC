# Cross-version interoperability (network task 14, phase 7).
#
# The programme's headline claim is that two builds from different releases stay on one network. A
# claim like that decays the moment nobody checks it, so it is checked here on every push — twice,
# because there are two different things to be sure of.
#
#   * `matrix` runs the in-repo mixed-release suite: a peer advertising an older feature set and a
#     different rule set, negotiating with the current build and then exchanging discovery, content
#     and tunnel traffic with it. This runs on every commit and needs no second checkout.
#
#   * `previous-release` takes the wire corpus committed at an EARLIER revision — the last release
#     tag when one is published, otherwise the last revision that changed the corpus — and runs the
#     current build against those bytes. What it asserts depends on which side of the NDR2 flag day
#     each of those frames sits on, and the test reads that out of the bytes. Silence is not the
#     same as compatibility: the job fails when it cannot find something to compare against, when
#     the corpus is empty, and when the test that carries the assertion did not actually execute.
#
# Neither job is a *live* mixed-release run: both compare a build against recorded bytes, not
# against a second running process. Network rows L-86..L-90 stay RETIRING until that exists.
name: cross-version

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a release that ages out of compatibility is noticed before somebody reports it.
    - cron: '0 6 * * 1'

jobs:
  matrix:
    name: mixed-release peers on one network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Negotiation and mixed-release traffic
        run: >
          ./gradlew :transport:test --stacktrace
          --tests '*CrossVersionIT'
          --tests '*NegotiationTest'
          --tests '*ForwardCompatibilityTest'
          --tests '*MessageRouterTest'

      # The conformance harness is what every claim above is measured against, so it runs here too:
      # a weakened harness would make this whole job pass for the wrong reason.
      - name: Conformance harness
        run: >
          ./gradlew :transport:test :core:test --stacktrace
          --tests '*CanonicalMutationFuzzTest'
          --tests '*WireFixtureTest'
          --tests '*WireSchemaGeneratorTest'
          --tests '*MessageCodecTypeTagTest'
          --tests '*TypeTagsTest'

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Rust half of the differential pair
        working-directory: .
        run: cargo test -p nodera-codec

      # A fixture mutated by the run means the encoder drifted and something silently accepted it.
      - name: Golden fixtures unchanged
        run: git diff --exit-code -- fixtures/

  previous-release:
    name: current build vs the previous release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # There is a previous BUILD long before there is a previous RELEASE. This step used to look
      # only for a release tag and, finding none, hand the rest of the job an empty string — every
      # later step was `if:`-ed out and the job reported success having compared nothing. A green
      # check that asserts nothing is worse than a red one, so the fallback is git history: the
      # newest ancestor commit that changed the committed wire corpus is a real earlier build of
      # this project, and its fixtures are the bytes that build was asserted to emit.
      - name: Find the previous build to compare against
        id: previous
        run: |
          set -euo pipefail
          ref=""
          kind=""
          tag="$(git tag --sort=-creatordate | grep -v '^latest$' | head -1 || true)"
          if [ -n "$tag" ]; then
            ref="$tag"
            kind="release tag"
          else
            # No release tag has been published yet. Fall back to the last revision that changed
            # the wire corpus, excluding HEAD itself (which may be the change under test).
            ref="$(git log --format=%H HEAD~1 -- fixtures/wire/ | head -1 || true)"
            kind="last wire-changing revision"
            if [ -z "$ref" ]; then
              ref="$(git rev-parse HEAD~1 2>/dev/null || true)"
              kind="parent revision"
            fi
          fi
          if [ -z "$ref" ]; then
            echo "::error::no previous release tag AND no earlier revision exists, so this job \
          cannot compare this build against anything. It fails rather than reporting a \
          compatibility it never checked."
            exit 1
          fi
          echo "previous build: $ref ($kind)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      # The previous build's wire corpus is already committed at that revision — those files ARE the
      # bytes it was asserted to emit, checked by its own WireFixtureTest at the time. Reading them
      # out of git is both cheaper and more honest than rebuilding an old tree, whose regeneration
      # would be performed by whatever encoder this runner happens to compile.
      - name: Extract the previous build's wire corpus
        id: corpus
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/build/previous-corpus"
          rm -rf "$dest"
          mkdir -p "$dest"
          if ! git archive "${{ steps.previous.outputs.ref }}" fixtures/wire \
              | tar -x -C "$dest" --strip-components=2; then
            echo "::error::revision ${{ steps.previous.outputs.ref }} has no fixtures/wire corpus, \
          so there is nothing to interoperate with. Failing instead of passing on silence."
            exit 1
          fi
          count="$(find "$dest" -name '*.bin' | wc -l)"
          echo "$count frames from ${{ steps.previous.outputs.ref }}"
          if [ "$count" -eq 0 ]; then
            echo "::error::the previous build's corpus is empty; this job cannot tell whether the \
          two builds interoperate, and passing on that basis would be a lie"
            exit 1
          fi
          echo "dir=$dest" >> "$GITHUB_OUTPUT"

      # Which assertion is correct depends on the epoch each of those frames carries.
      #
      #   epoch 1 (pre-NDR2): the frame MUST be refused, loudly and at the magic. That is the flag
      #     day, and a silent misparse is the outcome the magic number exists to prevent.
      #   epoch 2 or later:   the frame MUST decode, because TLV absorbs additive change and a
      #     genuinely incompatible change allocates a new kind rather than a new epoch.
      #
      # PreviousReleaseCorpusTest reads the epoch out of each file rather than being told, so it
      # cannot assert the wrong thing after the next release. --rerun-tasks --no-build-cache because
      # a FROM-CACHE test task proves nothing about a corpus that is not one of its inputs.
      - name: Interoperate with, or cleanly refuse, the previous build
        run: >
          ./gradlew :transport:test --stacktrace --rerun-tasks --no-build-cache
          --tests '*PreviousReleaseCorpusTest'
          --tests '*ForwardCompatibilityTest'
          -Dnodera.wire.previousCorpus=${{ steps.corpus.outputs.dir }}

      # The assertion above lives inside a test, and a test that does not run is indistinguishable
      # from one that passed unless somebody looks. This reads the JUnit XML and requires the
      # cross-build test to have EXECUTED — not been filtered out, not been skipped.
      - name: Prove the cross-build assertion actually executed
        if: always()
        run: |
          set -euo pipefail
          xml="java/transport/build/test-results/test/TEST-dev.nodera.protocol.wire.PreviousReleaseCorpusTest.xml"
          if [ ! -f "$xml" ]; then
            echo "::error::$xml is missing: the cross-build test never ran, so this job asserted \
          nothing about compatibility with ${{ steps.previous.outputs.ref }}."
            exit 1
          fi
          if grep -q '<skipped' "$xml"; then
            echo "::error::the cross-build test was SKIPPED. A skip here is the exact silent no-op \
          this job exists to prevent."
            exit 1
          fi
          if ! grep -q 'tests="1"' "$xml"; then
            echo "::error::the cross-build test class reported no executed test."
            cat "$xml"
            exit 1
          fi
          echo "cross-build assertion executed against ${{ steps.previous.outputs.ref }} \
          (${{ steps.previous.outputs.kind }})"
          grep -o '\[previous-release\][^<]*' "$xml" || true
