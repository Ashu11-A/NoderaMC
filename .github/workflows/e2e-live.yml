# Live acceptance under Xvfb — the L-45 deliverable, now ONE SUITE PER RUNNER.
#
# Every suite boots the real Rust tracker + rendezvous, headless workers, and real NeoForge
# clients on a virtual display. They used to be grouped three-to-a-job and run back to back,
# which made a job as slow as the sum of its suites and let one suite's leftovers reach the next
# (a Gradle daemon holding the suite lock, a dedicated server still holding RCON). A matrix gives
# each suite its own machine: the wall clock is the SLOWEST suite rather than the total, and
# cross-suite interference is impossible by construction instead of by a lock.
#
# `fail-fast: false` on purpose — one red suite must not cancel the evidence from the others.
#
# Heavy by design (real Minecraft clients): manual dispatch + nightly schedule, never per-push.
#
# A dispatch may name a SUBSET (`suites: mesh-soak,pickup`). Iterating on one suite used to mean
# booting eleven machines to read one of them; the nightly and a bare dispatch still run all.
name: e2e-live
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma-separated suites to run (blank = all)'
        required: false
        default: ''
      soak_seconds:
        description: 'Soak length for e2e-determinism (issue #5 acceptance = 7200)'
        required: false
        default: ''
  schedule:
    - cron: '17 3 * * *'   # nightly, off-peak

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          REQUESTED: ${{ inputs.suites }}
        # Each entry is one scripts/e2e-<suite>.sh. Suites that reuse the shared NoderaE2E world
        # bake it themselves — the launcher bakes on first use — so no entry depends on another.
        # An unknown name is a hard error: a typo must not silently run nothing.
        run: |
          set -euo pipefail
          all=(continuity crash pickup mobs pearl password rekey commands farlands \
               ownership-follow mesh-soak determinism)
          if [[ -z "${REQUESTED// /}" ]]; then
            picked=("${all[@]}")
          else
            IFS=',' read -ra picked <<< "${REQUESTED// /}"
            for s in "${picked[@]}"; do
              [[ -e "scripts/e2e-$s.sh" ]] || { echo "::error::unknown suite '$s'"; exit 1; }
            done
          fi
          # Validate EVERY picked suite, defaults included. This check used to run only on a
          # user-supplied list, so a script that lost its executable bit sailed through the plan and
          # died twelve minutes later inside a runner with a bare `exit 126` — which reads as a
          # suite failure rather than as a file mode. `e2e-determinism.sh` did exactly that twice:
          # a full-file rewrite drops the +x bit, and `git` records the mode, so the loss is
          # invisible in a diff that shows no content change.
          for s in "${picked[@]}"; do
            [[ -x "scripts/e2e-$s.sh" ]] || {
              echo "::error::scripts/e2e-$s.sh is not executable (mode $(stat -c '%a' "scripts/e2e-$s.sh" 2>/dev/null || echo '?')) — run: git update-index --chmod=+x scripts/e2e-$s.sh"
              exit 1
            }
          done
          json=$(printf '%s\n' "${picked[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          # A malformed list would reach fromJSON as an expression error 20 lines away from here.
          [[ $json == \[*\] ]] || { echo "::error::could not build the matrix: '$json'"; exit 1; }
          printf 'suites=%s\n' "$json" >> "$GITHUB_OUTPUT"
          printf 'running: %s\n' "${picked[*]}"

  suite:
    name: ${{ matrix.suite }}
    needs: plan
    runs-on: ubuntu-latest
    # 45 minutes fits every suite except a long determinism soak, whose whole point is duration —
    # issue #5's acceptance is a 2-hour run, dispatched with SOAK_SECONDS=7200. The nightly runs
    # the short version, so the ceiling only has to accommodate the dispatch.
    timeout-minutes: ${{ matrix.suite == 'determinism' && 200 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Xvfb + GL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1 libglx-mesa0 x11-apps imagemagick
      - name: Build stack
        run: |
          (cd rust && cargo build --release --bin nodera-tracker --bin nodera-rendezvous)
          ./gradlew :peer:installDist :neoforge-mod:build -x test -x check
      - name: ${{ matrix.suite }} under Xvfb
        env:
          # Only e2e-determinism reads it; an empty value leaves the suite's own default in place.
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
        run: |
          NODERA_E2E_TIMEOUT_MULT=3 xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' \
            scripts/e2e-${{ matrix.suite }}.sh --no-build
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.suite }}-logs
          path: |
            run/logs/e2e-${{ matrix.suite }}/
            run/results/e2e-${{ matrix.suite }}/
            java/neoforge-mod/run-host/logs/
            java/neoforge-mod/run-join/logs/
            java/neoforge-mod/run-join2/logs/
            java/neoforge-mod/run-join3/logs/
          if-no-files-found: ignore
