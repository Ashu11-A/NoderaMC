# Live acceptance under Xvfb — the L-45 deliverable, now ONE SUITE PER RUNNER.
#
# Every suite boots the real Rust tracker + rendezvous, headless workers, and real NeoForge
# clients on a virtual display. They used to be grouped three-to-a-job and run back to back,
# which made a job as slow as the sum of its suites and let one suite's leftovers reach the next
# (a Gradle daemon holding the suite lock, a dedicated server still holding RCON). A matrix gives
# each suite its own machine: the wall clock is the SLOWEST suite rather than the total, and
# cross-suite interference is impossible by construction instead of by a lock.
#
# `fail-fast: false` on purpose — one red suite must not cancel the evidence from the others.
#
# Heavy by design (real Minecraft clients): manual dispatch + nightly schedule, never per-push.
#
# A dispatch may name a SUBSET (`suites: mesh-soak,pickup`). Iterating on one suite used to mean
# booting eleven machines to read one of them; the nightly and a bare dispatch still run all.
name: e2e-live
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma-separated suites to run (blank = all)'
        required: false
        default: ''
      soak_seconds:
        description: 'Soak length for the determinism scenario (issue #5 acceptance = 7200)'
        required: false
        default: ''
  schedule:
    - cron: '17 3 * * *'   # nightly, off-peak

# Least privilege by default. A job that needs more says so itself and overrides this block.
# Without a default, every job inherits whatever the repository's default token scope happens to
# be — which is not a decision this file was making deliberately.
permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      # This job compiles Java. That is not obvious from reading it — the only thing it runs is
      # `nodera-test.sh list` — but the script builds the tool it lists, and `:core` compiles at
      # `--release 21`. Without a JDK 21 the runner's default compiler answers `error: release
      # version 21 not supported`, and the whole workflow dies in ninety seconds having booted no
      # suite at all. Twelve consecutive nightlies (2026-07-30 → 2026-08-10) failed exactly there.
      # The suite job installs the same toolchain for the same reason; this job needed it first.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Not strictly required, but without it the plan job cold-builds :core + :testing on every
      # nightly to print a list of names it already knows how to derive.
      - uses: gradle/actions/setup-gradle@v4
      # `list` output is parsed into the matrix below, so the tool's own build must not share its
      # stdout with it. Building it in its own step keeps the parsed lines to scenario ids only.
      - name: Build the test tool
        run: ./gradlew :testing:installDist --console=plain
      - id: pick
        env:
          REQUESTED: ${{ inputs.suites }}
        # Both lists come from the TOOL. There used to be one list here — an `all=(…)` array of
        # thirteen ids — validated against the tool, and validating a stale list only proves it is
        # stale in a legal way: every id in it existed, and the six scenarios added after it was
        # written (telemetry, churn, ownership, endpoint, folia, plugins) were never dispatched by
        # any nightly. `list --ids --exclude-tag hardware` is the tool's own answer to "what runs
        # unattended", so the second table is gone rather than re-synchronised.
        #
        # Each id is one scenario in the `nodera-test` tool (formerly one scripts/e2e-<suite>.sh).
        # Scenarios that reuse the shared NoderaE2E world bake it themselves, so no entry depends
        # on another and the matrix can be any subset in any order.
        #
        # `known` stays the WIDER set (hardware included): a dispatch may deliberately name a
        # hardware scenario, and the suite job's own requirement check is what reports the missing
        # device. An unknown name is still a hard error — a typo must not silently run nothing.
        #
        # The old check tested that a shell file existed and was executable — the executable bit in
        # particular, because a full-file rewrite drops it, git records the mode, and the loss is
        # invisible in a diff that shows no content change. A Java scenario has no mode to lose;
        # what replaces that check is asking the tool.
        run: |
          set -euo pipefail
          mapfile -t known < <(scripts/nodera-test.sh list --ids --no-build)
          mapfile -t all   < <(scripts/nodera-test.sh list --ids --exclude-tag hardware --no-build)
          # mapfile from a process substitution cannot fail the shell, so an unbuilt or broken tool
          # would arrive here as an empty matrix and a green plan job that dispatched nothing.
          (( ${#known[@]} && ${#all[@]} )) || {
            echo "::error::the test tool listed no scenarios"; exit 1
          }
          if [[ -z "${REQUESTED// /}" ]]; then
            picked=("${all[@]}")
          else
            IFS=',' read -ra picked <<< "${REQUESTED// /}"
          fi
          for s in "${picked[@]}"; do
            printf '%s\n' "${known[@]}" | grep -qx -- "$s" || {
              echo "::error::unknown scenario '$s'. Known: ${known[*]}"
              exit 1
            }
          done
          json=$(printf '%s\n' "${picked[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          # A malformed list would reach fromJSON as an expression error 20 lines away from here.
          [[ $json == \[*\] ]] || { echo "::error::could not build the matrix: '$json'"; exit 1; }
          printf 'suites=%s\n' "$json" >> "$GITHUB_OUTPUT"
          printf 'running: %s\n' "${picked[*]}"

  suite:
    name: ${{ matrix.suite }}
    needs: plan
    runs-on: ubuntu-latest
    # 45 minutes fits every suite except a long determinism soak, whose whole point is duration —
    # issue #5's acceptance is a 2-hour run, dispatched with SOAK_SECONDS=7200. The nightly runs
    # the short version, so the ceiling only has to accommodate the dispatch.
    timeout-minutes: ${{ matrix.suite == 'determinism' && 200 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # No `dtolnay/rust-toolchain@stable` here: rust-toolchain.toml pins the channel and
      # rustup honours it automatically (see the `rust` job). Installing `stable` on top
      # compiled nothing and put a FLOATING version into the rust-cache key, so every
      # stable release invalidated the whole cache — one guaranteed cold build per cycle.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Xvfb + GL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1 libglx-mesa0 x11-apps imagemagick
      - name: Build stack
        # `nodera-telemetry` is here because the FIRST full-matrix dispatch (run 31396175753)
        # failed the `telemetry` leg on `T0: no collector binary at target/release/nodera-telemetry`.
        # That leg had never been dispatched by any nightly — the workflow's matrix was a hand-kept
        # list of thirteen that omitted it — so nothing had ever asked this step for the collector,
        # and the step built the two services it did know about. It is a harness fault rather than a
        # property of the runner, which is exactly why it now FAILS the leg instead of skipping it
        # (PR #259): a structural skip is red under every flag, and this is what that rule is for.
        # Keep this list in step with what the scenarios resolve out of `target/release`.
        run: |
          (cargo build --release --bin nodera-tracker --bin nodera-rendezvous --bin nodera-telemetry)
          ./gradlew :peer:installDist :neoforge-mod:build :paper-plugin:jar :testing:installDist \
            -x test -x check
      # The server-category scenarios need a Paper or Folia jar, and nothing in this repository
      # ever staged one — so `ServerEndpointSupport.skipReason` fired on every machine, including
      # this runner, and `endpoint`/`folia`/`plugins` had never actually run anywhere. That is a
      # STRUCTURAL skip, which `docs/testing/Task.0.md` bans: requirements describe the MACHINE,
      # and anything that can be fetched or built is fetched or built rather than waited for. The
      # suites still download nothing themselves — one script, called here, so a local run and a CI
      # run stay the same code path (server task 4; L-64's live half, L-66's exit).
      - name: Stage the platform jar
        if: matrix.suite == 'endpoint' || matrix.suite == 'folia' || matrix.suite == 'plugins'
        run: |
          case "${{ matrix.suite }}" in
            folia)            scripts/stage-server-jars.sh folia ;;
            endpoint|plugins) scripts/stage-server-jars.sh paper ;;
          esac

      - name: ${{ matrix.suite }} under Xvfb
        env:
          # Only the determinism scenario reads it; empty leaves the scenario's own default.
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
        run: |
          NODERA_E2E_TIMEOUT_MULT=3 xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' \
            scripts/nodera-test.sh run ${{ matrix.suite }} --no-build
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.suite }}-logs
          path: |
            run/results/${{ matrix.suite }}/
            build/reports/nodera/TEST-REPORT.md
            build/reports/nodera/test-report.json
            endpoints/neoforge-mod/run-host/logs/
            endpoints/neoforge-mod/run-join/logs/
            endpoints/neoforge-mod/run-join2/logs/
            endpoints/neoforge-mod/run-join3/logs/
          if-no-files-found: ignore
