# Rolling "latest" build. On every push, compile BOTH toolchains, collect the artifacts
# (nodera-tracker + nodera-rendezvous binaries and the neoforge-mod.jar) into build/, and attach
# them to a single GitHub release tagged `latest`. The release is flagged **prerelease** — it is
# marked latest but is not an officially published release.
#
# This reuses `scripts/dev.sh --build-only`, the same build+collect path a developer runs locally,
# so CI and local builds cannot drift.
name: release-latest
on:
  push:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # rust-toolchain.toml pins the channel; rustup (preinstalled on the runner) honours it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # One command builds the Rust workspace + the mod jar and collects all three artifacts into
      # build/ — identical to a local `scripts/dev.sh --build-only`.
      - name: Build both toolchains into build/
        run: bash scripts/dev.sh --build-only

      - name: List collected artifacts
        run: ls -la build/

      # The digest manifest is what the services' self-update lane reads. A service compares the
      # published digest of its own asset against the digest of the file it is executing — the only
      # comparison that can see a new build at all, because the rolling `latest` keeps VERSION at the
      # same value across every push. Without this asset the update lane finds nothing and stays put,
      # which is safe but silent, so it is generated in the same step that publishes the binaries.
      - name: Generate SHA256SUMS for the release assets
        working-directory: build
        run: |
          sha256sum nodera-tracker nodera-rendezvous neoforge-mod.jar > SHA256SUMS
          cat SHA256SUMS

      # Provenance, not just integrity (L-81). The digest above proves a download was not corrupted;
      # it proves nothing about who wrote the manifest, because whoever can publish to this release
      # can publish a self-consistent pair. A detached Ed25519 signature over SHA256SUMS is what the
      # updater checks BEFORE it reads a digest.
      #
      # Skipped, loudly, when no signing key is configured. A release that silently ships unsigned is
      # exactly the state this step exists to end, so it warns rather than passing quietly. OpenSSL
      # signs Ed25519 natively and is already on the runner; the key is a PEM private key in the
      # NODERA_RELEASE_SIGNING_KEY secret, and its public half is compiled into the services as
      # `update::DEFAULT_RELEASE_PUBLIC_KEY`.
      - name: Sign the digest manifest
        working-directory: build
        env:
          SIGNING_KEY: ${{ secrets.NODERA_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::warning::NODERA_RELEASE_SIGNING_KEY is not set - this release is UNSIGNED and the update lane can only verify integrity (L-81)."
            exit 0
          fi
          umask 077
          printf '%s' "$SIGNING_KEY" > signing.pem
          openssl pkeyutl -sign -rawin -inkey signing.pem -in SHA256SUMS -out SHA256SUMS.sig
          # Verify what was just produced. A signature nobody checked is a signature that can be
          # malformed for a whole release cycle before anyone notices.
          openssl pkey -in signing.pem -pubout -out signing.pub
          openssl pkeyutl -verify -rawin -pubin -inkey signing.pub -in SHA256SUMS -sigfile SHA256SUMS.sig
          rm -f signing.pem signing.pub
          ls -l SHA256SUMS.sig

      # Roll the `latest` prerelease to this commit. Delete-then-create keeps a single latest tag
      # that always points at the newest build; `|| true` covers the first run when none exists.
      - name: Publish rolling latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA:0:7}"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            build/nodera-tracker \
            build/nodera-rendezvous \
            build/neoforge-mod.jar \
            build/SHA256SUMS \
            $( [ -f build/SHA256SUMS.sig ] && echo build/SHA256SUMS.sig ) \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "latest ($short)" \
            --notes "Rolling build from ${GITHUB_REF_NAME}@${short}. Marked latest (prerelease) — not an officially published release."
