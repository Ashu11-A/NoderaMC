# Build every Nodera deliverable, on every architecture, and publish them as one release.
#
# ---------------------------------------------------------------------------
# WHAT IT PUBLISHES
# ---------------------------------------------------------------------------
#
#   nodera-neoforge-<version>.jar        NeoForge 1.21.1 mod
#   nodera-paper-<version>.jar           Paper/Folia endpoint plugin
#   nodera-peer-<version>.jar            headless always-on node (`java -jar`)
#   nodera-app-<system>-<arch>.<ext>     companion app installer: 4 desktop + 1 signed Android APK
#   nodera-tracker-<arch>-<version>      tracker service binary, x64 + arm64
#   nodera-rendezvous-<arch>-<version>   rendezvous service binary, x64 + arm64
#   SHA256SUMS[.sig]                     what the services' self-update lane reads
#
# The names are NOT written here. `scripts/lib/release.sh` is the one naming table; this workflow
# calls `scripts/release.sh`, which is the same script a developer runs locally, and the publish job
# asks it whether the release is complete rather than listing files by hand. That is the whole point
# of the rewrite: the previous workflow named three files in a `gh release create` argument list, and
# because nothing compared that list to anything, three of the six deliverables were built in CI and
# thrown away for months without a single failure.
#
# ---------------------------------------------------------------------------
# WHEN IT RUNS
# ---------------------------------------------------------------------------
#
#   push to main    rolls the `latest` prerelease to that commit
#   push of v*      publishes a real, versioned release
#   manual          same as a main push, for re-cutting `latest` after an infrastructure failure
#
# It does NOT run on feature branches. It used to run on every push to every branch, which meant any
# branch could roll the public `latest` release to its own build — `containers.yml` already refuses
# to do that for exactly the reason stated in its header ("no tag anybody else follows moves"), and
# this workflow now follows the same rule.
#
# ---------------------------------------------------------------------------
# STRICTNESS
# ---------------------------------------------------------------------------
#
# `latest` publishes what built and WARNS about what did not: it re-cuts on every merge, and losing
# a whole rolling build because one platform's runner was unavailable helps nobody.
#
# A `v*` tag is strict. A versioned release is permanent and is what people link to, so an
# incomplete one fails the run and publishes nothing.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# One release at a time. Two runs racing on `gh release delete latest` + `create` is how a rolling
# release ends up with assets from two different commits under one tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The release tag, resolved once. Every job reads it through NODERA_RELEASE_TAG so the version
  # token in an asset name is derived from one place — see `release_version_token`.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
      strict: ${{ steps.pick.outputs.strict }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "strict=1" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "strict=0" >> "$GITHUB_OUTPUT"
          fi

  # --- the three jars: architecture-independent, so one runner produces all of them -------------
  jars:
    name: jars
    needs: plan
    runs-on: ubuntu-24.04
    env:
      NODERA_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/release.sh --component jars
      - uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: build/release/*
          if-no-files-found: error
          retention-days: 1

  # --- the two service binaries, once per architecture ------------------------------------------
  #
  # Native runners, not QEMU: `containers.yml` documents why (a Rust release build under emulation
  # takes the better part of an hour), and the same arithmetic applies here.
  services:
    name: services · ${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      NODERA_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      # Declared, not detected — see `release_arch_token`. The x64/arm64 legs both happen to detect
      # correctly on Linux, but a build that asks the shell what it is targeting is one emulator
      # away from being wrong, and the app legs prove it.
      NODERA_RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel; rustup honours it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release-${{ matrix.arch }}
      - run: scripts/release.sh --component services
      # The staged name already carries the architecture, so both legs can upload into one artifact
      # namespace without colliding.
      - uses: actions/upload-artifact@v4
        with:
          name: release-services-${{ matrix.arch }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 1

  # --- the companion app: one native installer per system AND architecture ----------------------
  #
  # Four legs, because a deb and an msi cannot be produced from one machine and each needs its own
  # architecture's toolchain. `fail-fast: false` so a runner outage on one platform costs that
  # platform's installer and not the other three — the publish job is what decides whether an
  # incomplete set may be released.
  #
  # There is no macOS leg. `macos-14` built a valid `.dmg` on the first run; `macos-13` — the last
  # x86-64 macOS image, deprecated — never got a runner at all, and sat at "Waiting for a runner to
  # pick up this job" for fifteen hours while holding `publish` and therefore the whole release.
  # See NODERA_RELEASE_SYSTEMS in `scripts/lib/release.sh` for why shipping arm64 alone was not the
  # answer, and for what reviving it needs.
  #
  # Every leg needs a JDK as well as Rust and bun: the app bundles the headless node
  # (`:peer:installDist`) as a Tauri resource.
  app:
    name: app · ${{ matrix.system }}-${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            arch: x64
            runner: ubuntu-24.04
          - system: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - system: windows
            arch: x64
            runner: windows-2022
          - system: windows
            arch: arm64
            runner: windows-11-arm
    env:
      NODERA_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      # REQUIRED here, not merely tidy. Git for Windows is an x86-64 build of bash; on the
      # `windows-11-arm` runner it executes under emulation and answers `uname -m` with `x86_64`,
      # so that leg staged a genuinely-arm64 installer under the x64 name. The matrix knows what it
      # is building; the shell does not.
      NODERA_RELEASE_ARCH: ${{ matrix.arch }}
      NODERA_RELEASE_SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: release-app-${{ matrix.system }}-${{ matrix.arch }}
      - uses: oven-sh/setup-bun@v2

      # Tauri's Linux bundler links against the system webview and packages with dpkg-deb.
      - name: Linux bundler dependencies
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
                                  libayatana-appindicator3-dev patchelf

      # bash, because `scripts/release.sh` is the same script on every platform. The Windows runners
      # ship Git bash, and using it is what keeps the release lane from growing a second, PowerShell
      # implementation of the naming table.
      - name: Build and stage the installer
        shell: bash
        run: scripts/release.sh --component app

      - uses: actions/upload-artifact@v4
        with:
          name: release-app-${{ matrix.system }}-${{ matrix.arch }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 1

  # --- the Android APK: the one deliverable that cannot be built without a secret ---------------
  #
  # Its own job rather than a fifth `app` matrix leg, because almost nothing is shared: it
  # cross-compiles from Linux against the NDK, it dexes the Java worker into the APK instead of
  # bundling a launcher directory, and it needs the Android SDK.
  #
  # `scripts/android-apk.sh --require-release-key` REFUSES to build when the signing secret is
  # absent. The script generates a development key when run locally so a developer can install on a
  # phone without thinking about it; that key is minted from a hardcoded password, so anybody can
  # reproduce it, and Android identifies an app by its signing certificate — an install carrying
  # that signature could never be updated by a genuinely signed build. Publishing one would be
  # unfixable after the fact, so an absent secret is a failed leg and `latest` reports the gap.
  #
  # Secrets: NODERA_ANDROID_KEYSTORE_BASE64 (the keystore, base64) and NODERA_ANDROID_KEY_PASSWORD.
  # The alias is not secret and defaults to `nodera`.
  android:
    name: app · android
    needs: plan
    runs-on: ubuntu-24.04
    env:
      NODERA_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      NODERA_RELEASE_SYSTEM: android
      NODERA_ANDROID_KEYSTORE_BASE64: ${{ secrets.NODERA_ANDROID_KEYSTORE_BASE64 }}
      NODERA_ANDROID_KEY_PASS: ${{ secrets.NODERA_ANDROID_KEY_PASSWORD }}
      NODERA_ANDROID_KEY_ALIAS: ${{ vars.NODERA_ANDROID_KEY_ALIAS || 'nodera' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: jdk
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: release-android
      - uses: oven-sh/setup-bun@v2

      # The RUST Tauri CLI, and it must be that one — `tauri android init` bakes whichever CLI form
      # generated the project into the Gradle callback it writes. Generated through the npm binary
      # the callback is `node tauri` resolved from `app/`, which is nothing, and every assemble dies
      # with `Cannot find module '.../app/tauri'` long after init reported success. See the note in
      # scripts/android-apk.sh.
      #
      # Cached because `cargo install` compiles it from source for several minutes, and the version
      # is pinned so the cache key means something.
      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-v2-${{ runner.os }}-${{ runner.arch }}
      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version '^2' --locked

      # `pick_jdk` in the script searches sdkman and the distro JVM paths, neither of which is where
      # setup-java puts a runner's JDK. Pointed at it explicitly rather than widened to guess: the
      # Android Gradle Plugin cannot read class files newer than 21, and picking up the wrong JDK
      # fails deep inside Gradle with a message about nothing recognisable.
      - name: The Android build's JDK
        run: echo "NODERA_ANDROID_JAVA_HOME=${{ steps.jdk.outputs.path }}" >> "$GITHUB_ENV"

      # The same script a developer runs, so the pinned SDK/NDK/build-tools versions cannot drift
      # between a laptop and CI.
      - name: Android SDK, NDK and Rust targets
        run: scripts/android-toolchain.sh

      # The Tauri CLI comes from here (a prebuilt npm binary bun has cached), not from
      # `cargo install tauri-cli`, which compiles it from source.
      - name: The companion UI
        run: cd app/ui && bun install --frozen-lockfile && bun run build

      - name: Build, sign and stage the APK
        run: scripts/release.sh --component android

      # Proof in the log that the artifact carries the RELEASE certificate. The fingerprint is
      # public — it is in every APK this key signs — so printing it discloses nothing and is the
      # only way to tell from the outside which key was used.
      - name: Which certificate signed it
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/34.* | head -1)"
          "$tools/apksigner" verify --print-certs build/release/nodera-app-android-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build/release/*
          if-no-files-found: error
          retention-days: 1

  # --- merge, verify, checksum, sign, publish ---------------------------------------------------
  publish:
    needs: [plan, jars, services, app, android]
    # `always()` so a platform that failed does not silently cancel the release; whether an
    # incomplete set may be published is decided by `--verify`, deliberately, in one place. `jars`
    # is required outright: a release with no mod in it is not a release.
    if: always() && needs.jars.result == 'success'
    runs-on: ubuntu-24.04
    env:
      NODERA_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      NODERA_RELEASE_STRICT: ${{ needs.plan.outputs.strict }}
    steps:
      - uses: actions/checkout@v4

      # Every leg staged into `build/release`, so merging is one download into the same directory.
      - uses: actions/download-artifact@v4
        with:
          path: build/release
          pattern: release-*
          merge-multiple: true

      - name: What was collected
        run: ls -la build/release

      # The gate. On a `v*` tag a missing deliverable fails here and nothing is published; on
      # `latest` it warns. An UNEXPECTED file fails either way — a stale asset published beside the
      # current set is a file claiming to be a version this release is not.
      - name: The release is complete
        run: scripts/release.sh --verify

      # Digests over every asset, not just the binaries: the update lane reads this file, and a
      # person checking a jar they downloaded deserves the same line. Generated in the job that
      # publishes, because a manifest describing files a later step might not upload is worse than
      # none.
      - name: Digest manifest
        run: scripts/release.sh --checksums

      # Provenance (L-81). Skipped loudly when no key is configured — see `sign` in the script.
      - name: Sign the digest manifest
        env:
          NODERA_SIGNING_KEY: ${{ secrets.NODERA_RELEASE_SIGNING_KEY }}
        run: scripts/release.sh --sign

      # Delete-then-create for the rolling tag only. A `v*` release is created once and never
      # rolled; `--clobber` would let a re-run quietly replace a published, linked-to artifact.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          if [[ "$TAG" == "latest" ]]; then
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            title="latest ($short)"
            notes="Rolling build from ${GITHUB_REF_NAME}@${short}. Marked latest (prerelease) — not an officially published release."
          else
            title="$TAG"
            notes="Nodera $TAG."
          fi
          # `find | xargs` rather than a written-out list: the manifest decides what a release
          # contains, and a second list here is a second thing to forget to update.
          find build/release -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes "$notes" \
                $( [[ "$PRERELEASE" == "true" ]] && echo --prerelease )
