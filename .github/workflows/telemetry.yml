# The telemetry lane's gate.
#
# Three jobs, and the middle one is the one that matters:
#
#   consent-lane  runs the `telemetry` scenario against the REAL binaries — a worker nobody asked
#                 collects nothing, a consented worker's rows carry a rotating subject and no
#                 address, an undeclared event is refused, revocation forgets the identifier, and
#                 the node is unaffected when the collector dies (Plan.6 D10).
#   registry-mirror  proves the Java emitter and telemetry/src/schema.rs still agree.
#                 Two implementations of one contract drift unless something mechanical fails.
#   stack-smoke   brings the Big Data plane up and proves a submitted batch becomes a queryable
#                 row — telemetry 2 deliverable 8.
#
# None of these gate gameplay: telemetry has no authority, so a red job here means the measurement
# plane is broken, never that the network is.
name: telemetry
on:
  push:
    paths:
      - 'telemetry/**'
      - 'tracker/src/telemetry.rs'
      - 'rendezvous/src/telemetry.rs'
      - 'peer/src/**/telemetry/**'
      - 'peer/src/**/headless/WorkerTelemetryService.java'
      - 'endpoints/neoforge-mod/src/**/ModTelemetry.java'
      - 'docker/telemetry/**'
      - 'library/java/testing/src/main/java/dev/nodera/testkit/**'
      - 'scripts/nodera-test.sh'
      - 'scripts/telemetry-stack.sh'
      - '.github/workflows/telemetry.yml'
  pull_request:
  workflow_dispatch:

# Least privilege by default. A job that needs more says so itself and overrides this block.
# Without a default, every job inherits whatever the repository's default token scope happens to
# be — which is not a decision this file was making deliberately.
permissions:
  contents: read

jobs:
  consent-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # No `dtolnay/rust-toolchain@stable` here: rust-toolchain.toml pins the channel and
      # rustup honours it automatically (see the `rust` job). Installing `stable` on top
      # compiled nothing and put a FLOATING version into the rust-cache key, so every
      # stable release invalidated the whole cache — one guaranteed cold build per cycle.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Rust unit tests (the gate at the receiver)
        working-directory: .
        run: cargo test -p nodera-telemetry -p nodera-tracker -p nodera-rendezvous

      - name: Clippy
        working-directory: .
        run: cargo clippy -p nodera-telemetry --all-targets -- -D warnings

      - name: Java emitter tests
        # `:endpoint` and not `:neoforge-mod`: ModTelemetry is Minecraft-free and moved to the
        # endpoint library on 2026-07-30. Gradle FAILS a --tests filter that matches nothing, which
        # is why this is the right way round — a filter pointed at the wrong module would otherwise
        # report green while testing nothing.
        run: ./gradlew :peer:test --tests '*Telemetry*' :endpoint:test --tests '*Telemetry*'

      # The scenario is headless — no display, no Minecraft — which is why it is the one live
      # lane that belongs in a per-push workflow rather than in the nightly matrix.
      - name: End-to-end consent lane
        run: scripts/nodera-test.sh run telemetry

      - name: Collect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-e2e
          path: |
            run/results/telemetry/**
            build/reports/nodera/TEST-REPORT.md
          if-no-files-found: warn

  registry-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # No `dtolnay/rust-toolchain@stable` here: rust-toolchain.toml pins the channel and
      # rustup honours it automatically (see the `rust` job). Installing `stable` on top
      # compiled nothing and put a FLOATING version into the rust-cache key, so every
      # stable release invalidated the whole cache — one guaranteed cold build per cycle.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # The mirror test SKIPS when the binary is absent, so building it first is what makes this
      # job meaningful rather than green-by-default.
      - name: Build the collector
        working-directory: .
        run: cargo build --release -p nodera-telemetry

      - name: The registries agree
        run: ./gradlew :peer:test --tests '*TelemetryRegistryMirrorTest*'

      - name: The published registry is readable
        run: target/release/nodera-telemetry --print-schema | python3 -m json.tool > /dev/null

  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compose files are valid
        working-directory: docker/telemetry
        run: |
          cp .env.example .env
          # The pseudonymisation key is minted in memory; only the warehouse/dashboard passwords
          # need materialising for a `docker compose config` validity check.
          sed -i 's/^CLICKHOUSE_PASSWORD=.*/CLICKHOUSE_PASSWORD=ci-clickhouse/' .env
          sed -i 's/^GRAFANA_PASSWORD=.*/GRAFANA_PASSWORD=ci-grafana/' .env
          docker compose config > /dev/null

      # --wait --wait-timeout: without them, `depends_on: service_healthy` makes compose wait for a
      # crash-looping container forever, and the job dies at its own timeout with no logs collected.
      # Failing in five minutes leaves the Logs step below something to show.
      - name: Bring the plane up
        working-directory: docker/telemetry
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: A submitted batch becomes a queryable row
        run: scripts/telemetry-stack.sh smoke

      - name: Logs
        if: always()
        working-directory: docker/telemetry
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        working-directory: docker/telemetry
        run: docker compose down -v
