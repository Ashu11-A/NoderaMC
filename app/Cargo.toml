# Task 32 — the Nodera companion app (Tauri: Rust backend + React frontend).
#
# EXCLUDED from the cargo workspace (see the root Cargo.toml): Tauri needs per-OS native webview deps
# not present in the headless gate. Build it on a machine with the Tauri prerequisites installed:
#   cd app && cargo tauri dev      # dev run (window + tray + daemon supervisor)
#   cd app && cargo tauri build    # release installer
#
# Option B (locked): this app SUPERVISES a bundled headless Java Nodera peer (reusing all tested Java
# peer/validation logic). The Rust side is the UI + tray + autostart + control endpoint + daemon
# supervisor + metrics aggregation; it depends on nodera-codec for the shared wire types.
# Its own workspace, declared rather than inherited. The root manifest also excludes this path;
# either alone is sufficient, and having both is the point — `cargo` invoked from inside this
# directory stops here regardless of what the root says, and a future edit to the root's `exclude`
# cannot silently pull webkit2gtk into `cargo test --workspace`.
[workspace]

[package]
name = "nodera-app"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false
description = "Nodera companion app: always-on headless peer + dashboard + system tray"

# Two targets on purpose: the desktop binary, and the cdylib the Android Activity loads through JNI.
# `rlib` keeps the unit tests compiling against the same code the app runs.
[lib]
name = "nodera_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Everything this app *is*. The shell here is the webview, the tray, the autostart and the command
# registration — nothing else. See that crate's manifest for why the split is a crate boundary.
nodera-core = { path = "../library/rust/nodera-core" }
tauri = { version = "2", features = ["tray-icon"] }
# The native save dialog behind "Save logs" — the OS picker, not a path typed into the app.
tauri-plugin-dialog = "2"
# Handing a link to the desktop's default browser. `<a target="_blank">` opens nothing in a Tauri v2
# webview, so every outbound link in the interface went through the host or did not work at all.
tauri-plugin-opener = "2"
# `nodera://tracker-store?url=…` — the link a website's "add this store" button opens, mirroring
# Mihon's `mihon://extension-store?url=…`. Registers the scheme with the OS on desktop and delivers
# the Android VIEW intent; the app never acts on a link, it only shows it and waits.
tauri-plugin-deep-link = "2"
# Diagnostics that must be readable on a device with no terminal; the Android build routes this
# into logcat, the desktop build into stderr.
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Two desktop OS integrations with no mobile meaning: an Android app is already single-instance,
# and "launch at login" is not something a phone offers. Both crates compile for Android but with
# their entire API cfg'd out, which turns a missing concept into a build error — so they are
# excluded here rather than papered over at the call site.
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
# Tauri custom-protocol asset serving in release builds.
custom-protocol = ["tauri/custom-protocol"]
