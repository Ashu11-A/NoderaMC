# Running a Nodera tracker and rendezvous from the published images.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose -f docker/compose.yml up -d
#
# <!-- AI-AGENT-INSTRUCTION: This file is what a self-hoster copies. It must stay runnable with no
#      edits beyond .env, and it must never require the repository — it pulls images, it does not
#      build them. Do not add a `build:` key here; docker/telemetry/docker-compose.yml is the
#      development stack and is a separate thing. -->
#
# Two independent services. Neither depends on the other to function: a tracker with no rendezvous
# still answers queries, and a rendezvous with no tracker still relays for peers that know its
# address (it is only undiscoverable). Run one, the other, or both.
#
# A third service, `web`, sits behind the `site` profile and is not part of that pair — it is the
# project's own website, and `docker compose up -d` deliberately does not start it.

name: nodera

services:
  tracker:
    image: ghcr.io/ashu11-a/noderamc:tracker-${NODERA_IMAGE_TAG:-latest}
    restart: unless-stopped
    # SIGTERM starts a drain: refuse new work, tell the peers, tell the trackers, wait for in-flight
    # work. The drain grace is 30 seconds by default and Docker's stop timeout is 10, so without
    # this every deploy kills the service mid-drain.
    stop_grace_period: 45s
    ports:
      # UDP costs one round trip instead of a TCP handshake, which matters for a peer sweeping many
      # trackers. Dropping the UDP line works; peers just fall back to TCP.
      - "${NODERA_TRACKER_PORT:-6969}:6969/tcp"
      - "${NODERA_TRACKER_PORT:-6969}:6969/udp"
    environment:
      # The address peers should reach this tracker at. Empty falls back to the bind address, which
      # is `0.0.0.0:6969` inside a container and therefore useless to anybody outside it — this is
      # the one variable a public deployment cannot leave unset.
      NODERA_TRACKER_ADVERTISED_ROUTES: "${NODERA_TRACKER_ADVERTISED_ROUTES:?set this to the public host:port peers should use}"
      NODERA_TRACKER_MAX_SERVICES: "${NODERA_TRACKER_MAX_SERVICES:-256}"
      NODERA_TRACKER_PER_IP_ANNOUNCE_QUOTA: "${NODERA_TRACKER_PER_IP_ANNOUNCE_QUOTA:-60}"
    volumes:
      # The service identity lives here. Losing it means presenting to the network as a brand-new,
      # unmeasured tracker — the availability score this host has earned is attached to the key.
      - tracker-state:/var/lib/nodera

  rendezvous:
    image: ghcr.io/ashu11-a/noderamc:rendezvous-${NODERA_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Longer than the tracker's: a drain here waits for bridged circuits carrying real transfers,
    # and cutting one costs a peer its download rather than a query it will retry.
    stop_grace_period: 60s
    ports:
      - "${NODERA_RENDEZVOUS_PORT:-7500}:7500/tcp"
    environment:
      # Without at least one tracker this relay is undiscoverable: peers can only reach it if they
      # were configured with its address by hand.
      NODERA_RENDEZVOUS_TRACKER_ENDPOINTS: "${NODERA_RENDEZVOUS_TRACKER_ENDPOINTS:?set this to the tracker(s) this relay should announce itself to}"
      NODERA_RENDEZVOUS_ADVERTISED_ROUTES: "${NODERA_RENDEZVOUS_ADVERTISED_ROUTES:?set this to the public host:port peers should use}"
      # Keeps reservation proofs valid across a restart. Empty mints an ephemeral key at boot, which
      # is correct but invalidates every outstanding reservation on every restart.
      NODERA_RENDEZVOUS_RESERVATION_HMAC_KEY_HEX: "${NODERA_RENDEZVOUS_RESERVATION_HMAC_KEY_HEX:-}"
      NODERA_RENDEZVOUS_MAX_CONCURRENT_CIRCUITS: "${NODERA_RENDEZVOUS_MAX_CONCURRENT_CIRCUITS:-0}"
      NODERA_RENDEZVOUS_DRAIN_GRACE_SECONDS: "${NODERA_RENDEZVOUS_DRAIN_GRACE_SECONDS:-30}"
    volumes:
      - rendezvous-state:/var/lib/nodera

  # The public website. Nothing else in this file depends on it and it depends on nothing here — a
  # self-hoster running a tracker has no use for it, which is why it is not in the `up -d` line at
  # the top of this file. It is here so the project's own host can run the site out of the same
  # compose project it already runs, and so `docker compose pull web` is the whole update path.
  web:
    # Its OWN tag variable, and the only service here that defaults to `canary`.
    #
    # `NODERA_IMAGE_TAG` is a project-wide pin — noderamc.org's own host holds it at a commit sha,
    # which is right for a tracker and a relay: those carry peer state and reservation identity, and
    # an operator wants to choose when they move. The site carries no state and is meant to follow
    # main within minutes of a merge; that is the whole purpose of the update timer next door in
    # deploy/vps/. One variable cannot express both policies.
    #
    # It could not, and the failure was total rather than partial: the host pinned
    # `NODERA_IMAGE_TAG=sha-e772f07`, so compose asked for `web-sha-e772f07` — a tag from before the
    # web service existed — and `docker compose pull web` answered `manifest unknown`. The old
    # default was no better on a fresh host: `web-latest` is published only from a `v*` git tag, and
    # this repository has never had one, so the documented bootstrap could never have worked.
    #
    # `canary` is what `.github/workflows/containers.yml` publishes on every push to main, and what
    # `scripts/bootstrap-site-host.sh` says in its own header the steady state pulls. Anyone who
    # wants the site pinned too sets `NODERA_WEB_IMAGE_TAG` to a `sha-…` and the timer stops moving
    # it, which is the same escape hatch by a name that does not also move the tracker.
    image: ghcr.io/ashu11-a/noderamc:web-${NODERA_WEB_IMAGE_TAG:-canary}
    restart: unless-stopped
    # Behind a profile, so a plain `docker compose up -d` still brings up a tracker and a relay and
    # nothing else. Somebody self-hosting a tracker has no reason to also run noderamc.org's
    # website, and starting it for them would take port 8080 on their machine to do it. Everything
    # that does want it — scripts/bootstrap-site-host.sh and the systemd timer — says `--profile
    # site` explicitly rather than relying on naming the service being enough, which is only true
    # on newer Compose.
    profiles: ["site"]
    ports:
      # LOOPBACK ONLY, and never 0.0.0.0. The host in front of this terminates TLS for other
      # people's sites out of the same Caddy; a container published on every interface would be a
      # second, plaintext, unlogged way in to this one, reachable by IP and bypassing every header
      # in web/noderamc.caddy. Dropping the `127.0.0.1:` prefix also opens a port on a machine whose
      # firewall rules this repository does not manage.
      # 8099 on the host, not 8080. The container still listens on 8080 internally; only the host
      # side moved. 8080 is the single most contended port on a machine that runs anything else —
      # on noderamc.org's own host it belongs to `wings`, the Pelican daemon supervising a dozen
      # other people's game servers, and the collision surfaced as a Docker networking error at
      # `up`, not as anything naming a port:
      #
      #   failed to bind host port for 127.0.0.1:8080: address already in use
      #
      # A default that collides on the project's own deployment is the wrong default. This number
      # and the `reverse_proxy` upstream in web/noderamc.caddy are one decision written twice;
      # scripts/bootstrap-site-host.sh refuses to install if they disagree.
      - "127.0.0.1:${NODERA_WEB_PORT:-8099}:8080/tcp"
    # No `stop_grace_period`: unlike the two services above there is no drain to protect. The
    # responses are static files and Docker's default 10 seconds is more than the in-flight ones
    # need.
    #
    # No volume, and no `healthcheck:` either. The site is baked into the image — a new site is a
    # new image — and the health check that matters lives in docker/web/Dockerfile, where it can be
    # written once and apply to `docker run` as well as to this file.

volumes:
  tracker-state:
  rendezvous-state:
