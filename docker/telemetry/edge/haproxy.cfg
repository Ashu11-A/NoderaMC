# TLS termination for the public telemetry listener.
#
# TCP mode, not HTTP: the telemetry wire is length-prefixed frames (the same framing the tracker
# and rendezvous services speak), so there is nothing for an HTTP proxy to route on. HAProxy's job
# here is exactly one thing — turn a plaintext listener into a TLS one — and it is a separate
# container so the ingest service stays free of a TLS stack it would otherwise have to keep patched.
global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend telemetry_tls
    bind :25621 ssl crt /etc/haproxy/certs/telemetry.pem
    default_backend telemetry_ingest

backend telemetry_ingest
    server ingest ingest:25620 check
