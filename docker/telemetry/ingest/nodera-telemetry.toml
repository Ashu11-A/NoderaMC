# Ingest configuration for the compose deployment.
#
# No pseudonymisation secret lives here — or anywhere on disk. Each rotation period, the ingest
# process mints a fresh key from the OS CSPRNG and holds it only in memory, wiping it the moment
# the period rolls (docs/telemetry/LIMITATIONS.fixed.md L-72). This file carries only policy, so it
# stays publishable, and an operator with the full config still cannot reproduce a previous period's
# subjects.

bind_addr = "0.0.0.0:25620"

spool_dir = "/var/lib/nodera/spool"
# Rotate often enough that Vector's tail stays close to real time, and large enough that a busy
# hour does not turn into thousands of files.
spool_max_bytes = 33554432   # 32 MiB
spool_max_seconds = 60

# One day. Long enough for "did yesterday's release regress joins?", short enough that a stored
# subject cannot be followed across a week.
subject_rotation_days = 1

# Operator-supplied `cidr,country,asn` table. Nodera ships none — a geolocation database is a
# licensing decision. Without it every row is recorded as ZZ/0, which is honest.
geo_table_path = "/etc/nodera/geo.csv"

max_frame_bytes = 1048576
max_events_per_batch = 500
max_attrs_per_event = 32
max_event_age_seconds = 604800    # 7 days: an emitter may drain a week-old spool, not a month
max_clock_skew_seconds = 300

quota_window_seconds = 60
per_ip_batch_quota = 30
per_ip_event_quota = 5000

report_interval_seconds = 60

# Is this deployment published to the internet? (telemetry L-73)
#
# The listener speaks plaintext; TLS is terminated by `edge`. Setting this makes that arrangement
# enforced rather than assumed — the plaintext port then serves only the ranges named below (plus
# loopback, for the healthcheck), so a client that finds the port and dials it in the clear is
# disconnected before it is read. Leave it false on a private single-host deployment.
#
# 172.16.0.0/12 is Docker's default bridge space, which is where `edge` dials from in this stack.
public_endpoint = false
trusted_proxy_cidrs = ["172.16.0.0/12"]
