# Nodera — root Gradle properties.
# Task 0 pins Java 21 / MC 1.21.1 / NeoForge 21.1.x. This environment runs JDK 25, so the
# pure-Java modules compile against the host JDK (Java 21 language feature level only).
# When the NeoForge toolchain is onboarded, set the strict pin back here.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# VFS file-watching off (containers/CI friendliness). Reproducible-archive settings live in the
# convention plugin (nodera.java-library.gradle.kts, AbstractArchiveTask block).
org.gradle.vfs.watch=false

# Kotlin compile daemon (build-logic's precompiled script plugins).
#
# Without an explicit heap the daemon OOMs on a machine that is already running a Minecraft client
# or two, and the failure is actively misleading: the plugin catches the OOM, retries with
# "Using fallback strategy: Compile without Kotlin daemon", and that in-process pass compiles the
# .gradle.kts files WITHOUT the generated kotlin-dsl accessors on its classpath. What the user sees
# is eighteen lines of `Unresolved reference 'java' / sourceCompatibility / testImplementation`
# pointing at convention plugins that are perfectly correct — a memory problem wearing a syntax
# error's clothes, and it survives every cache purge because the real cause was never on screen.
#
# So: a modest bounded heap, and NO silent fallback. If the daemon cannot start, the build now says
# that instead of blaming the source.
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m
kotlin.daemon.useFallbackStrategy=false

# Project identity.
modId=nodera
mavenGroup=dev.nodera
