[versions]
junit             = "5.11.0"
assertj           = "3.27.7"
jqwik             = "1.9.0"
mockito           = "5.14.2"
mockitoJupiter    = "5.14.2"
caffeine          = "3.1.8"
zstd              = "1.5.6-3"
roaringbitmap     = "1.3.0"
archunit          = "1.3.0"
jmh               = "0.7.2"       # me.champeau.jmh Gradle plugin (the :peer benchmark source set)
jmhCore           = "1.37"        # the JMH runtime/annotations the plugin resolves
asm               = "9.7.1"       # bytecode reader for the structural code report (:worker)
jetbrainsAnnotations = "26.0.1"
bouncycastle      = "1.84"
rocksdb           = "9.7.3"
# Paper API for the endpoint plugin (server task 1). Matches the Minecraft version the mod pins.
paperApi            = "1.21.1-R0.1-SNAPSHOT"

[libraries]
junit-jupiter       = { module = "org.junit.jupiter:junit-jupiter",       version.ref = "junit" }
junit-platform      = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.0" }
assertj-core        = { module = "org.assertj:assertj-core",              version.ref = "assertj" }
jqwik               = { module = "net.jqwik:jqwik",                       version.ref = "jqwik" }
jqwik-api           = { module = "net.jqwik:jqwik-api",                   version.ref = "jqwik" }
mockito-core        = { module = "org.mockito:mockito-core",              version.ref = "mockito" }
mockito-jupiter     = { module = "org.mockito:mockito-junit-jupiter",     version.ref = "mockitoJupiter" }
caffeine            = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
zstd-jni            = { module = "com.github.luben:zstd-jni",             version.ref = "zstd" }
roaringbitmap       = { module = "org.roaringbitmap:RoaringBitmap",       version.ref = "roaringbitmap" }
archunit            = { module = "com.tngtech.archunit:archunit",         version.ref = "archunit" }
archunit-junit5     = { module = "com.tngtech.archunit:archunit-junit5",  version.ref = "archunit" }
jetbrains-annotations = { module = "org.jetbrains:annotations",           version.ref = "jetbrainsAnnotations" }
bouncycastle       = { module = "org.bouncycastle:bcprov-jdk18on",          version.ref = "bouncycastle" }
rocksdbjni         = { module = "org.rocksdb:rocksdbjni",                   version.ref = "rocksdb" }
paper-api          = { module = "io.papermc.paper:paper-api",               version.ref = "paperApi" }
# JMH: the benchmark harness itself. The Gradle plugin resolves these versions for the `jmh`
# source set; pinning them here keeps the harness on one version across the tree.
jmh-core           = { module = "org.openjdk.jmh:jmh-core",                 version.ref = "jmhCore" }
jmh-annprocess     = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmhCore" }
# ASM: reads the compiled `dev.nodera..` classes for the structural report (reference graph +
# in-loop cost smells). Test-scoped in `:worker` only — no production code depends on it.
asm                = { module = "org.ow2.asm:asm",                          version.ref = "asm" }
asm-tree           = { module = "org.ow2.asm:asm-tree",                     version.ref = "asm" }

# Plugin coordinates (for build-logic)
plugin-jmh = { module = "me.champeau.jmh:jmh-gradle-plugin", version.ref = "jmh" }

[plugins]
# Applied by `:peer` directly (NOT via a build-logic convention plugin: any edit under
# java/build-logic/src/main/kotlin re-triggers the kotlin-dsl accessor breakage documented in
# gradle.properties, and this needs no shared conventions).
jmh = { id = "me.champeau.jmh", version.ref = "jmh" }

[bundles]
test-impl = ["assertj-core", "jqwik"]
