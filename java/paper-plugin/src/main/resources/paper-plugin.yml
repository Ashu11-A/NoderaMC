name: NoderaEndpoint
version: '${version}'
main: dev.nodera.endpoint.NoderaEndpointPlugin
api-version: '1.21'
folia-supported: true
description: Nodera decentralized validation for a Paper or Folia endpoint.
authors: [Nodera]
website: https://github.com/Ashu11-A/NoderaMC
