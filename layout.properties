# The repository layout table — where every module, crate and well-known directory lives.
#
# WHY THIS FILE EXISTS
# --------------------
# The same table used to be written down five times, in five languages: `settings.gradle.kts`
# mapped module names to directories, `TestPaths.java` mapped them again for the live harness,
# `scripts/lib/e2e-main.sh` mapped them a third time for the shell suites, `CodeGraph.java`
# rediscovered them by listing `java/`, and `scripts/test-counts.sh` recovered them by regex from
# README rows. Two of those copies were already wrong when this file was written — a test had been
# silently skipping for months against a path that had moved, and a CI workflow was watching a file
# that no longer existed. Nothing failed; the copies just quietly disagreed.
#
# So: this is the one table. Nothing else may hardcode a module or crate directory. A relocation is
# an edit here plus a `git mv`, and `LayoutManifestTest` fails the build if the two disagree.
#
# FORMAT
# ------
# `java.util.Properties`, deliberately — it is the only syntax every consumer parses with zero
# dependencies: Gradle's Kotlin DSL and Java read it natively, and bash, Python and Rust each need
# about ten lines. Values are directories relative to the repository root, and nothing else: no
# interpolation, no file names, no globs. Consumers compose the rest, because `build/libs/x.jar` is
# a property of a build system and this file is a property of the tree.
#
# The repository root is the directory holding both `VERSION` and `settings.gradle.kts`. Every
# consumer walks up to find it rather than counting `..` segments, so nothing here breaks when a
# directory changes depth.

# --- Gradle modules. The key suffix is the Gradle project name (`:core`, `:neoforge-mod`, …),
# --- which is contract with every `build.gradle.kts` and must not change when a directory moves.

# Pure-Java, Minecraft-free. `core` depends on nothing but the JDK.
module.core             = java/core
# Unified deterministic-engine + validation API (issue #30): absorbs the former simulation /
# consensus / coordinator / committee / shadow-validation / fallback modules — packages unchanged,
# so the ArchUnit determinism ban on dev.nodera.simulation.. still bites.
module.engine           = java/engine
# Unified network API (issue #30): absorbs the former protocol / transport-api / transport-socket /
# transport-rendezvous modules — packages unchanged. The empty transport-neoforge placeholder was
# deleted; the in-game relay lane lands in neoforge-mod.
module.transport        = java/transport
# Unified storage API (issue #30): absorbs the former storage-api / storage-eventsourced /
# storage-rocksdb / storage-client modules — packages unchanged (dev.nodera.storage.*).
module.storage          = java/storage
# Unified peer API (issue #30): absorbs the former peer-runtime / distribution / diagnostics
# modules — packages unchanged. Also the always-on node: `dev.nodera.headless` came back from
# `:worker` on 2026-07-30, so a peer cannot be built without the services that make it serve. The
# entry point compiles in `src/headless` and never reaches the mod's fat jar; launcher name
# `nodera-headless` is contract (rust/nodera-app's daemon.rs + every script stages it).
module.peer             = java/peer
# Shared test library (issue #30): LoopbackTransport, FakeRegion, wire-fixture IO, the live harness.
module.testing          = java/testing
# The only place Minecraft types may appear, besides its own tests.
module.neoforge-mod     = java/neoforge-mod
# The Paper/Folia endpoint plugin. Produces `nodera-endpoint.jar`; the Paper API is compileOnly and
# resolved from PaperMC's maven inside the module, so an outage there cannot break the
# Minecraft-free build.
module.paper-plugin     = java/paper-plugin

# The included build. Not a module: it is consumed by `includeBuild`, not `include`.
buildLogic              = java/build-logic

# --- Cargo crates. The key suffix is the package name from the crate's own `Cargo.toml`.
crate.nodera-codec      = rust/nodera-codec
crate.nodera-service    = rust/nodera-service
crate.nodera-tracker    = rust/nodera-tracker
crate.nodera-rendezvous = rust/nodera-rendezvous
crate.nodera-telemetry  = rust/nodera-telemetry
# Excluded from the cargo workspace (Tauri pulls in native GUI deps the services must not build).
crate.nodera-app        = rust/nodera-app

# --- Well-known directories that are not a module or a crate.
# The directory holding the cargo workspace manifest — where `cargo test` and `cargo build` run.
# `nodera-app` is excluded from that workspace and is built from its own directory instead.
dir.cargoWorkspace      = rust
# Where cargo leaves its build output. Read by everything that stages a release binary. Always
# `<cargoWorkspace>/target`, but spelled out because scripts stage from it without running cargo.
dir.cargoTarget         = rust/target
# The static site deployed to noderamc.org.
dir.web                 = site
# Cross-toolchain release staging: the one directory that holds both Java and Rust artifacts.
dir.artifacts           = build
# Runtime scratch for live suites: logs, results, the suite lock.
dir.run                 = run
