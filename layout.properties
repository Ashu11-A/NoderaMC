# The repository layout table — where every module, crate and well-known directory lives.
#
# WHY THIS FILE EXISTS
# --------------------
# The same table used to be written down five times, in five languages: `settings.gradle.kts`
# mapped module names to directories, `TestPaths.java` mapped them again for the live harness,
# `scripts/lib/e2e-main.sh` mapped them a third time for the shell suites, `CodeGraph.java`
# rediscovered them by listing `java/`, and `scripts/test-counts.sh` recovered them by regex from
# README rows. Two of those copies were already wrong when this file was written — a test had been
# silently skipping for months against a path that had moved, and a CI workflow was watching a file
# that no longer existed. Nothing failed; the copies just quietly disagreed.
#
# So: this is the one table. Nothing else may hardcode a module or crate directory. A relocation is
# an edit here plus a `git mv`, and `LayoutManifestTest` fails the build if the two disagree.
#
# FORMAT
# ------
# `java.util.Properties`, deliberately — it is the only syntax every consumer parses with zero
# dependencies: Gradle's Kotlin DSL and Java read it natively, and bash, Python and Rust each need
# about ten lines. Values are directories relative to the repository root, and nothing else: no
# interpolation, no file names, no globs. Consumers compose the rest, because `build/libs/x.jar` is
# a property of a build system and this file is a property of the tree.
#
# One section breaks that rule and says so: `services.*` names a git ref, two file names inside it
# and a URL, because the published service list stopped being a directory in this tree when it moved
# to its own branch. It is here rather than in a second manifest for exactly the reason this file
# exists — three builds in three languages have to resolve the same list, and the failure mode of a
# second table is the one this file was created to end.
#
# The repository root is the directory holding both `VERSION` and `settings.gradle.kts`. Every
# consumer walks up to find it rather than counting `..` segments, so nothing here breaks when a
# directory changes depth.

# --- Gradle modules. The key suffix is the Gradle project name (`:core`, `:neoforge-mod`, …),
# --- which is contract with every `build.gradle.kts` and must not change when a directory moves.

# Pure-Java, Minecraft-free. `core` depends on nothing but the JDK.
module.core             = library/java/core
# Unified deterministic-engine + validation API (issue #30): absorbs the former simulation /
# consensus / coordinator / committee / shadow-validation / fallback modules — packages unchanged,
# so the ArchUnit determinism ban on dev.nodera.simulation.. still bites.
module.engine           = library/java/engine
# Unified network API (issue #30): absorbs the former protocol / transport-api / transport-socket /
# transport-rendezvous modules — packages unchanged. The empty transport-neoforge placeholder was
# deleted; the in-game relay lane lands in neoforge-mod.
module.transport        = library/java/transport
# Unified storage API (issue #30): absorbs the former storage-api / storage-eventsourced /
# storage-rocksdb / storage-client modules — packages unchanged (dev.nodera.storage.*).
module.storage          = library/java/storage
# Unified peer API (issue #30): absorbs the former peer-runtime / distribution / diagnostics
# modules — packages unchanged. Also the always-on node: `dev.nodera.headless` came back from
# `:worker` on 2026-07-30, so a peer cannot be built without the services that make it serve. The
# entry point compiles in `src/headless` and never reaches the mod's fat jar; launcher name
# `nodera-headless` is contract (rust/nodera-app's daemon.rs + every script stages it).
module.peer             = peer
# Shared test library (issue #30): LoopbackTransport, FakeRegion, wire-fixture IO, the live harness.
module.testing          = library/java/testing
# What a Minecraft-hosting process needs to BE a node, with no Minecraft in it. Consumed by both
# endpoints; separate from `:peer` so the companion wire keeps a client/server compile boundary.
module.endpoint         = library/java/endpoint
# The only place Minecraft types may appear, besides its own tests.
module.neoforge-mod     = endpoints/neoforge-mod
# The Paper/Folia endpoint plugin. Produces `nodera-endpoint.jar`; the Paper API is compileOnly and
# resolved from PaperMC's maven inside the module, so an outage there cannot break the
# Minecraft-free build.
module.paper-plugin     = endpoints/paper-plugin

# The included build. Not a module: it is consumed by `includeBuild`, not `include`.
buildLogic              = library/java/build-logic

# --- Cargo crates. The key suffix is the package name from the crate's own `Cargo.toml`.
crate.nodera-codec      = library/rust/nodera-codec
crate.nodera-core       = library/rust/nodera-core
crate.nodera-service    = library/rust/nodera-service
crate.nodera-tracker    = tracker
crate.nodera-rendezvous = rendezvous
crate.nodera-telemetry  = telemetry
# Excluded from the cargo workspace (Tauri pulls in native GUI deps the services must not build).
crate.nodera-app        = app

# --- Frontend packages. The key suffix is the `name` field in the package's own `package.json` —
# --- the same rule `crate.*` follows, and for the same reason: a package renamed in one place and
# --- not the other is a dependency that resolves to nothing, and bun reports that as a package it
# --- has never heard of rather than as a directory that moved.
#
# One consumer CANNOT read this file: the root `package.json`'s `workspaces` array. Bun resolves the
# workspace before any of our code runs, exactly as Tauri parses `tauri.conf.json` and GitHub
# evaluates a `paths:` filter first — the three cases `check-layout-drift.sh` already exists for. So
# that array is the fifth kind of file that has to be compared against this table from outside, and
# `app/ui/tests/layout-workspace.test.mjs` is what compares them.
#
# `LayoutManifestTest` validates `module.*` and `crate.*`; a `package.*` prefix adds no Gradle
# obligation.

# The shared kit: the platform seam today, the design system when the launcher redesign lands.
# Depends on neither application, which is what lets both depend on it.
package.nodera-ui       = library/ts/nodera-ui
# The desktop frontend. Tauri reads `ui/dist` out of it (`app/tauri.conf.json`), composing that path
# from `crate.nodera-app` rather than naming this key — Tauri parses its own config first, so the
# path there is a literal and this key would be a second answer nothing checks.
package.nodera-app-ui   = app/ui
# The website's source. Same directory as `dir.web` below, and both statements are true of it: one
# says "this is where the deployed site is built from", the other says "this is a workspace
# package". They are separate keys because they answer separate questions and either could move
# without the other.
package.nodera-site     = web

# --- Well-known directories that are not a module or a crate.
# The directory holding the cargo workspace manifest — where `cargo test` and `cargo build` run.
# `nodera-app` is excluded from that workspace and is built from its own directory instead.
dir.cargoWorkspace      = .
# Where cargo leaves its build output. Read by everything that stages a release binary. Always
# `<cargoWorkspace>/target`, but spelled out because scripts stage from it without running cargo.
dir.cargoTarget         = target
# The static site deployed to noderamc.org. `scripts/build-site.sh` builds it into `<here>/dist`,
# which docker/web/Dockerfile copies into the published image. Its source is a workspace package —
# see `package.nodera-site`.
dir.web                 = web
# The units and helper the VPS runs under systemd — installed there by
# `scripts/bootstrap-site-host.sh`, never executed from this tree. They live in the repository so
# the thing running on the host is reviewable, diffable and reinstallable, rather than a file
# somebody once pasted over SSH.
dir.vpsUnits            = deploy/vps
# Cross-toolchain release staging: the one directory that holds both Java and Rust artifacts.
dir.artifacts           = build
# Runtime scratch for live suites: logs, results, the suite lock.
dir.run                 = run
# Where a resolved copy of the published service index is cached. Git-ignored: it is a build output,
# reproduced from the ref below, and a checkout that has never built has an empty one.
dir.services            = build/services

# --- The published service index. Not a directory in this tree: it lives on its own orphan branch,
# --- `services`, which shares no history with this one. A list that changes when an operator joins
# --- is data, not source, and a client fetching it should download a few kilobytes rather than
# --- resolve a path inside a code repository. Mirrors keiyoushi/extensions' `repo` branch.
#
# Three builds compile this list in — the companion app's built-in store (`app/build.rs`), the Java
# defaults (`:core`'s `generateOfficialServices`), and the validator (`scripts/services.py`) — and
# all three resolve it identically: local ref, then fetched remote ref, then the URL, then fail.

# The branch holding the index. `git show <ref>:<file>` is the first thing every resolver tries.
services.branch         = services
# The pretty-printed list contributors edit, and the file every resolver reads.
services.index          = index.json
# The same list minified. What shipped clients fetch at runtime; generated, never hand-edited.
services.minifiedIndex  = index.min.json
# The published format, which third-party stores are also written against.
services.schema         = index.schema.json
# Where the branch is served over https, for a build that has neither the ref nor a cache. Ends in a
# slash; a resolver appends one of the file names above.
services.rawBase        = https://raw.githubusercontent.com/Ashu11-A/NoderaMC/services/
# Where a shipped client points its built-in store: the minified index, spelled out in full rather
# than assembled, because `stores.rs` needs it as a compile-time constant and a URL assembled
# independently in four languages is four chances to assemble it differently. `scripts/services.py
# --validate` fails if this is not `services.rawBase` + `services.minifiedIndex`.
services.rawUrl         = https://raw.githubusercontent.com/Ashu11-A/NoderaMC/services/index.min.json
# The remote the branch is fetched from when a resolver has to reach for it.
services.remote         = origin
