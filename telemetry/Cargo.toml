[package]
name = "nodera-telemetry"
description = "Nodera telemetry ingest service — consented, schema-bounded, de-identified event collection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nodera-codec = { workspace = true }
# For `env` only: one environment-overlay implementation for all three services, so a variable that
# works on the tracker works the same way here. This crate takes no identity, drain, or update
# behaviour from it — telemetry is a deployment, never a peer.
nodera-service = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
# Test-only. Production TOML parsing goes through `nodera_service::config::load_toml`, which owns the
# error type; the only `toml::` calls here build fixtures and assert the round trip.
toml = { workspace = true }

[build-dependencies]
# The `VERSION` stamp, shared with the other services. No dependencies of its own, so it costs
# nothing on a cross-compiled release build.
nodera-build = { path = "../library/rust/nodera-service/build-version" }
