[package]
name = "nodera-tracker"
description = "Standalone Nodera tracker service (Task 28)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nodera-codec = { workspace = true }
# Identity, self-announce, drain and self-update are identical in both services; sharing them is what
# keeps a rendezvous and a tracker from drifting into two different definitions of "draining".
nodera-service = { workspace = true }
# The event model is shared with the receiver that validates it, so the two cannot drift.
nodera-telemetry = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
# Test-only. Production TOML parsing goes through `nodera_service::config::load_toml`, which owns the
# error type; the only `toml::` calls here build fixtures and assert the round trip.
toml = { workspace = true }

[build-dependencies]
# The `VERSION` stamp, shared with the other services. No dependencies of its own, so it costs
# nothing on a cross-compiled release build.
nodera-build = { path = "../library/rust/nodera-service/build-version" }
